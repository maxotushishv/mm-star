<!doctype html><html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MM STAR Admin</title><style>
:root{--r:#e61928;--k:#111}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f6f6f7;color:#171717}.top{background:#111;color:white;padding:12px 4vw;display:flex;align-items:center;gap:14px}.logo{width:95px;height:46px;object-fit:contain;background:#fff;border-radius:10px}.wrap{max-width:1200px;margin:auto;padding:24px 4vw}.card{background:#fff;border:1px solid #e7e7e7;border-radius:16px;padding:18px;box-shadow:0 6px 20px #0001}.form{display:grid;gap:10px;max-width:420px}.form input,.form textarea,.form select{padding:11px;border:1px solid #ddd;border-radius:10px}.btn{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;background:#111;color:#fff}.red{background:var(--r)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.table{width:100%;border-collapse:collapse;background:#fff}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:left}.muted{color:#777}.lang{margin-left:auto;display:flex;gap:6px}.lang button{border:0;border-radius:999px;padding:8px 10px;cursor:pointer}.hidden{display:none}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;display:none}
</style></head><body><header class="top"><img src="assets/logo.jpg" class="logo"><strong>MM STAR Admin</strong><div class="lang"><button onclick="setLang('ka')">🇬🇪</button><button onclick="setLang('tr')">🇹🇷</button></div><button class="btn" onclick="location.href='index.html'">Store</button></header><main class="wrap"><section id="login" class="card"><h2>Admin Login</h2><div class="form"><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button class="btn red" onclick="login()">შესვლა</button></div></section><section id="app" class="hidden"><div class="tabs"><button class="btn red" onclick="dashboard()">Dashboard</button><button class="btn" onclick="products()">პროდუქტები</button><button class="btn" onclick="categories()">კატეგორიები</button><button class="btn" onclick="orders(false)">შეკვეთები</button><button class="btn" onclick="orders(true)">დილერის შეკვეთები</button><button class="btn" onclick="dealers()">დილერები</button><button class="btn" onclick="integrations()">ინტეგრაციები</button><button class="btn" onclick="logout()">გასვლა</button></div><div id="panel"></div></section></main><div id="toast" class="toast"></div><script src="config.js"></script><script>
const apiBase=window.MMSTAR_CONFIG.apiBase||'/api';let token=sessionStorage.adminToken||'';const ah=()=>({authorization:'Bearer '+token,'content-type':'application/json'});async function api(path,opt={}){const r=await fetch(apiBase+'/'+path,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'ERROR');return d}function say(x){toast.textContent=x;toast.style.display='block';setTimeout(()=>toast.style.display='none',1800)}function setLang(v){localStorage.mmAdminLang=v;say(v==='tr'?'Dil değiştirildi':'ენა შეიცვალა')}async function login(){try{const d=await api('admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});token=d.token;sessionStorage.adminToken=token;show();dashboard()}catch(e){say(e.message)}}function show(){login.classList.add('hidden');app.classList.remove('hidden')}function logout(){sessionStorage.removeItem('adminToken');location.reload()}async function dashboard(){const d=await api('admin/dashboard',{headers:ah()});panel.innerHTML='<div class="grid">'+Object.entries(d.stats).map(([k,v])=>`<div class="card"><div class="muted">${k}</div><h2>${v}</h2></div>`).join('')+'</div>'}async function products(){const d=await api('admin/products',{headers:ah()});panel.innerHTML=`<div class="card"><h2>პროდუქტები</h2><p class="muted">შემდეგ ეტაპზე აქ დავამატებთ კომპიუტერიდან Upload + ფოტო URL ორივეს.</p><table class="table"><tr><th>კოდი</th><th>პროდუქტი</th><th>ფასი</th><th>მარაგი</th></tr>${d.products.map(x=>`<tr><td>${x.code||''}</td><td>${x.name||''}</td><td>${x.price||0} ₾</td><td>${x.stock||0}</td></tr>`).join('')}</table></div>`}async function categories(){const d=await api('admin/categories',{headers:ah()});panel.innerHTML=`<div class="card"><h2>კატეგორიები</h2>${d.categories.map(x=>`<p>${x.emoji||''} ${x.name||''}</p>`).join('')}</div>`}async function orders(dealer){const d=await api(dealer?'admin/dealer-orders':'admin/orders',{headers:ah()});panel.innerHTML=`<div class="card"><h2>${dealer?'დილერის შეკვეთები':'შეკვეთები'}</h2><table class="table"><tr><th>Invoice</th><th>სტატუსი</th><th>ჯამი</th></tr>${d.orders.map(x=>`<tr><td>${x.invoice||''}</td><td>${x.status||''}</td><td>${x.total||0} ₾</td></tr>`).join('')}</table></div>`}async function dealers(){const d=await api('admin/dealers',{headers:ah()});panel.innerHTML=`<div class="card"><h2>დილერები</h2>${d.dealers.map(x=>`<p>${x.companyType||''} ${x.name||''} — ${x.phone||''}</p>`).join('')}</div>`}async function integrations(){const d=await api('admin/integrations',{headers:ah()});panel.innerHTML=`<div class="card"><h2>ინტეგრაციები</h2><pre>${JSON.stringify(d.integrations,null,2)}</pre></div>`}if(token){show();dashboard().catch(()=>logout())}
</script></body></html>
