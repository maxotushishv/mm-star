const $=id=>document.getElementById(id),apiBase=window.MMSTAR_CONFIG.apiBase||'/api';let token=sessionStorage.getItem('mmAdminToken')||'',role=sessionStorage.getItem('mmAdminRole')||'admin',lang=localStorage.getItem('mmAdminLang')||'ka',current='dashboard';
const cache={products:[],categories:[],orders:[],dealerOrders:[],dealers:[],customers:[],staff:[],settings:{}};
async function loadPC(){
  const [pd,cd]=await Promise.all([
    api('admin/products',{headers:ah()}),
    api('admin/categories',{headers:ah()})
  ]);
  cache.products=pd.products||[];
  cache.categories=cd.categories||[];
  return {products:cache.products,categories:cache.categories};
}
function catName(id){
  if(!id)return '';
  const c=cache.categories.find(x=>x.id===id);
  return c?c.name:'';
}
function tops(){
  return cache.categories.filter(c=>!c.parentId);
}
function subs(parentId){
  return cache.categories.filter(c=>c.parentId===parentId);
}

async function api(path,opt={}){const r=await fetch(apiBase+'/'+path,opt),d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw new Error(d.error||`HTTP_${r.status}`);return d}function toast(m){$('toast').textContent=m;$('toast').style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').style.display='none',2500)}function modal(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modalBack').classList.add('open')}function closeModal(){$('modalBack').classList.remove('open')}
const tabs=['dashboard','products','categories','orders','dealerOrders','dealers','customers','staff','settings','integrations'];function visibleTabs(){return role==='sales'?['dashboard','orders','dealerOrders']:tabs}function renderNav(){$('adminNav').innerHTML=visibleTabs().map(x=>`<button class="${current===x?'active':''}" data-tab="${x}">${t(x)}</button>`).join('');$('adminNav').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>openTab(b.dataset.tab))}
function apply(){document.documentElement.lang=lang;document.querySelectorAll('.flag-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));$('loginTitle').textContent=t('login');$('loginUser').placeholder=t('user');$('loginPass').placeholder=t('pass');$('loginBtn').textContent=t('signin');$('logoutBtn').textContent=t('logout');renderNav();$('viewTitle').textContent=t(current);if(token)openTab(current,true)}
async function login(){try{const d=await api('admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:$('loginUser').value.trim(),password:$('loginPass').value})});token=d.token;role=d.role||'admin';sessionStorage.setItem('mmAdminToken',token);sessionStorage.setItem('mmAdminRole',role);showAdmin();openTab('dashboard')}catch(e){toast(e.message)}}function showAdmin(){$('loginView').classList.add('hidden');$('adminView').classList.remove('hidden');renderNav()}function logout(){sessionStorage.removeItem('mmAdminToken');sessionStorage.removeItem('mmAdminRole');location.reload()}
async function openTab(tab,rerender=false){if(role==='sales'&&!['dashboard','orders','dealerOrders'].includes(tab))return;current=tab;renderNav();$('viewTitle').textContent=t(tab);try{if(tab==='dashboard')await dashboard();if(tab==='products')await products();if(tab==='categories')await categories();if(tab==='orders')await orders(false);if(tab==='dealerOrders')await orders(true);if(tab==='dealers')await dealers();if(tab==='customers')await customers();if(tab==='staff')await staff();if(tab==='settings')await settings();if(tab==='integrations')await integrations()}catch(e){if(e.message==='AUTH_REQUIRED')return logout();toast(e.message)}}
async function dashboard(){const d=await api('admin/dashboard',{headers:ah()}),s=d.stats;$('panel').innerHTML=`<div class="stats-grid"><div class="stat-card"><span>${t('todaySales')}</span><strong>${money(s.todaySales)}</strong></div><div class="stat-card"><span>${t('todayOrders')}</span><strong>${s.todayOrders||0}</strong></div><div class="stat-card"><span>${t('monthSales')}</span><strong>${money(s.monthSales)}</strong></div><div class="stat-card"><span>${t('products')}</span><strong>${s.products||0}</strong></div><div class="stat-card"><span>${t('customers')}</span><strong>${s.customers||0}</strong></div><div class="stat-card"><span>${t('dealers')}</span><strong>${s.dealers||0}</strong></div></div><div class="dashboard-detail-grid"><div class="checkout-card"><h3>${t('topToday')}</h3>${(d.topToday||[]).length?d.topToday.map(x=>`<div class="dash-product"><img src="${esc(x.image||'assets/logo.jpg')}"><b>${esc(x.name)}</b><span>${x.qty}×</span></div>`).join(''):`<div class="muted">${t('noData')}</div>`}</div><div class="checkout-card"><h3>${t('lowStock')}</h3>${(d.lowStock||[]).length?d.lowStock.map(x=>`<div class="dash-row"><span>${esc(x.name)}</span><b>${x.stock}</b></div>`).join(''):`<div class="muted">${t('noData')}</div>`}</div><div class="checkout-card"><h3>${t('outOfStock')}</h3>${(d.outOfStock||[]).length?d.outOfStock.map(x=>`<div class="dash-row"><span>${esc(x.name)}</span><b>0</b></div>`).join(''):`<div class="muted">${t('noData')}</div>`}</div></div>`}
async function products(){await loadPC();$('panel').innerHTML=`<div class="admin-toolbar"><div><h3 style="margin:0">${t('products')}</h3></div><button class="btn btn-primary" id="addProduct">+ ${t('add')}</button></div><div class="table-wrap"><table class="table"><thead><tr><th>${t('image')}</th><th>${t('code')}</th><th>${t('name')}</th><th>${t('category')}</th><th>${t('subcategory')}</th><th>${t('price')}</th><th>${t('dealerPrice')}</th><th>${t('stock')}</th><th>${t('weight')}</th><th>${t('actions')}</th></tr></thead><tbody>${cache.products.length?cache.products.map(p=>`<tr><td><img class="thumb" src="${esc(p.image||'assets/logo.jpg')}" onerror="this.src='assets/logo.jpg'"></td><td>${esc(p.code)}</td><td>${esc(p.name)}</td><td>${esc(catName(p.categoryId))}</td><td>${esc(catName(p.subcategoryId))}</td><td>${money(p.price)}</td><td>${money(p.dealerPrice)}</td><td>${p.stock||0}</td><td>${Number(p.weightKg||1)} kg</td><td><div class="actions"><button class="btn btn-light btn-sm" data-edit="${p.id}">${t('edit')}</button><button class="btn btn-danger btn-sm" data-del="${p.id}">${t('delete')}</button></div></td></tr>`).join(''):`<tr><td colspan="10">${t('noData')}</td></tr>`}</tbody></table></div>`;$('addProduct').onclick=()=>productForm();$('panel').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>productForm(b.dataset.edit));$('panel').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteProduct(b.dataset.del))}
function productForm(id=''){const p=cache.products.find(x=>x.id===id)||{},cat=p.categoryId||'';modal(id?t('edit')+' — '+t('products'):t('add')+' — '+t('products'),`<div class="form"><div class="form-grid"><div class="field"><label>${t('code')}</label><input id="pCode" value="${esc(p.code||'')}"></div><div class="field"><label>${t('name')}</label><input id="pName" value="${esc(p.name||'')}"></div></div><div class="field"><label>${t('desc')}</label><textarea id="pDesc">${esc(p.description||'')}</textarea></div><div class="form-grid"><div class="field"><label>${t('category')}</label><select id="pCat"><option value=""></option>${tops().map(c=>`<option value="${c.id}" ${cat===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>${t('subcategory')}</label><select id="pSub"></select></div></div><div class="field"><label>${t('imageUrl')}</label><input id="pImage" value="${esc(p.image||'')}"></div><div class="image-picker"><input id="pFile" type="file" accept="image/*"><button class="btn btn-light" id="pUpload">${t('upload')}</button></div><img id="pPreview" class="upload-preview" src="${esc(p.image||'assets/logo.jpg')}"><div class="form-grid"><div class="field"><label>${t('price')}</label><input id="pPrice" type="number" step="0.01" value="${p.price??''}"></div><div class="field"><label>${t('dealerPrice')}</label><input id="pDealerPrice" type="number" step="0.01" value="${p.dealerPrice??''}"></div><div class="field"><label>${t('stock')}</label><input id="pStock" type="number" value="${p.stock??0}"></div><div class="field"><label>${t('weight')}</label><input id="pWeight" type="number" step="0.01" min="0.01" value="${p.weightKg??1}"></div></div><label class="check-item"><input id="pActive" type="checkbox" ${p.active!==false?'checked':''}> ${t('active')}</label><label class="check-item"><input id="pNew" type="checkbox" ${p.isNew?'checked':''}> ${t('new')}</label><label class="check-item"><input id="pSale" type="checkbox" ${p.saleActive?'checked':''}> ${t('sale')}</label><div class="form-grid"><div class="field"><label>${t('saleType')}</label><select id="pDiscountType"><option value="percent">${t('percent')}</option><option value="amount">${t('amount')}</option></select></div><div class="field"><label>${t('saleValue')}</label><input id="pDiscountValue" type="number" step="0.01" min="0" value="${p.discountValue??''}"></div></div><div class="field"><label>${t('salePrice')}</label><input id="pSalePrice" type="number" step="0.01" min="0" value="${p.salePrice??''}"></div><button class="btn btn-primary" id="pSave">${t('save')}</button></div>`);function fillSubs(){const list=subs($('pCat').value);$('pSub').innerHTML=`<option value=""></option>${list.map(s=>`<option value="${s.id}" ${p.subcategoryId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}`}$('pCat').onchange=fillSubs;fillSubs();if($('pDiscountType'))$('pDiscountType').value=p.discountType||'percent';$('pImage').oninput=()=>{$('pPreview').src=$('pImage').value||'assets/logo.jpg'};$('pUpload').onclick=async()=>{try{const f=$('pFile').files[0];if(!f)return;const url=await uploadImage(f,'products');$('pImage').value=url;$('pPreview').src=url;toast(t('uploadDone'))}catch(e){toast(e.message)}};$('pSave').onclick=async()=>{try{await api('admin/products',{method:'POST',headers:ah(),body:JSON.stringify({id,code:$('pCode').value,name:$('pName').value,description:$('pDesc').value,categoryId:$('pCat').value,subcategoryId:$('pSub').value,image:$('pImage').value,price:$('pPrice').value,dealerPrice:$('pDealerPrice').value,stock:$('pStock').value,weightKg:$('pWeight').value,active:$('pActive').checked,isNew:$('pNew').checked,saleActive:$('pSale').checked,discountType:$('pDiscountType').value,discountValue:$('pDiscountValue').value,salePrice:$('pSalePrice').value})});closeModal();toast(t('saved'));products()}catch(e){toast(e.message)}}}
async function uploadImage(file,folder){if(file.size>5*1024*1024)throw new Error('IMAGE_TOO_LARGE');const dataUrl=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)}),d=await api('admin/upload-image',{method:'POST',headers:ah(),body:JSON.stringify({dataUrl,folder})});return d.url}async function deleteProduct(id){if(!confirm(t('confirmDelete')))return;try{await api('admin/products/'+id,{method:'DELETE',headers:ah()});toast(t('deleted'));products()}catch(e){toast(e.message)}}
async function categories(){const d=await api('admin/categories',{headers:ah()});cache.categories=d.categories;$('panel').innerHTML=`<div class="admin-toolbar"><div><h3 style="margin:0">${t('categories')}</h3><span class="muted">${t('subcategoryHint')}</span></div><button class="btn btn-primary" id="addCat">+ ${t('add')}</button></div><div class="table-wrap"><table class="table"><tr><th>${t('image')}</th><th>${t('emoji')}</th><th>${t('name')}</th><th>${t('parent')}</th><th>${t('actions')}</th></tr>${cache.categories.length?cache.categories.map(c=>`<tr><td><img class="thumb" src="${esc(c.image||'assets/logo.jpg')}" onerror="this.src='assets/logo.jpg'"></td><td>${esc(c.emoji)}</td><td>${esc(c.name)}</td><td>${esc(catName(c.parentId)||t('mainCategory'))}</td><td><div class="actions"><button class="btn btn-light btn-sm" data-ce="${c.id}">${t('edit')}</button><button class="btn btn-danger btn-sm" data-cd="${c.id}">${t('delete')}</button></div></td></tr>`).join(''):`<tr><td colspan="5">${t('noData')}</td></tr>`}</table></div>`;$('addCat').onclick=()=>categoryForm();$('panel').querySelectorAll('[data-ce]').forEach(b=>b.onclick=()=>categoryForm(b.dataset.ce));$('panel').querySelectorAll('[data-cd]').forEach(b=>b.onclick=()=>deleteCategory(b.dataset.cd))}

ait api('admin/order-status',{method:'POST',headers:ah(),body:JSON.stringify({id:q.dataset.qs,dealer:q.dataset.dealer==='1',statusCode:q.value})});toast(t('saved'));orders(q.dataset.dealer==='1')}catch(e){toast(e.message)}})}

loseModal();toast(t('saved'));orders(dealer)}catch(e){toast(e.message)}};return}
const people=dealer?cache.dealers:cache.customers;modal(t('add')+' — '+(dealer?t('dealerOrders'):t('orders')),`<div class="form"><div class="field"><label>${dealer?t('dealer'):t('customer')}</label><select id="newPerson"><option value=""></option>${people.map(x=>`<option value="${x.id}">${esc(dealer?x.name:(x.firstName||'')+' '+(x.lastName||'')+' '+(x.phone||''))}</option>`).join('')}</select></div><div class="field"><label>${t('payment')}</label><select id="newPay"><option value="invoice">Invoice</option><option value="branch">Branch</option>${dealer?'':'<option value="keepz">Keepz</option><option value="bank">Bank</option>'}</select></div>${dealer?'':`<div class="field"><label>${t('delivery')}</label><select id="newDelivery"><option value="pickup">Pickup</option><option value="tbilisi">Tbilisi</option><option value="region">Region</option></select></div><div class="field"><label>${t('address')}</label><textarea id="newAddress"></textarea></div>`}<div><b>${t('items')}</b><div id="orderItems"></div><button class="btn btn-light btn-sm" id="addOrderItem">+ ${t('addItem')}</button></div><button class="btn btn-primary" id="createOrder">${t('save')}</button></div>`);let rows=[];function draw(){if(!rows.length)rows=[{productId:'',qty:1}];$('orderItems').innerHTML=rows.map((r,i)=>`<div class="form-grid" style="margin:8px 0"><select data-op="${i}"><option value=""></option>${cache.products.map(p=>`<option value="${p.id}" ${r.productId===p.id?'selected':''}>${esc(p.code)} — ${esc(p.name)}</option>`).join('')}</select><div style="display:flex;gap:6px"><input data-oq="${i}" type="number" min="1" value="${r.qty}" style="width:90px"><button class="btn btn-danger btn-sm" data-or="${i}">✕</button></div></div>`).join('');$('orderItems').querySelectorAll('[data-op]').forEach(e=>e.onchange=()=>rows[+e.dataset.op].productId=e.value);$('orderItems').querySelectorAll('[data-oq]').forEach(e=>e.oninput=()=>rows[+e.dataset.oq].qty=Number(e.value)||1);$('orderItems').querySelectorAll('[data
