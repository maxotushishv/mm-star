<!doctype html><html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MM STAR Dealer</title><link rel="icon" href="assets/logo.jpg"><link rel="stylesheet" href="site.css"></head><body>
<section id="loginView" class="login-card"><img class="brand-logo" src="assets/logo.jpg"><h2 id="loginTitle"></h2><div class="form"><input id="loginUser" autocomplete="username"><input id="loginPass" type="password" autocomplete="current-password"><button class="btn btn-primary" id="loginBtn"></button></div><div class="flags" style="margin-top:15px"><button class="flag-btn" data-lang="ka">🇬🇪</button><button class="flag-btn" data-lang="en">🇬🇧</button><button class="flag-btn" data-lang="tr">🇹🇷</button></div></section>
<section id="dealerView" class="hidden"><header class="site-header"><div class="header-inner"><img class="brand-logo" src="assets/logo.jpg"><b id="dealerName"></b><div class="header-search"><input id="search"></div><div class="header-actions"><div class="flags"><button class="flag-btn" data-lang="ka">🇬🇪</button><button class="flag-btn" data-lang="en">🇬🇧</button><button class="flag-btn" data-lang="tr">🇹🇷</button></div><button class="text-btn" id="ordersBtn"></button><button class="icon-btn" id="cartBtn">🛒 <span class="cart-badge" id="cartCount">0</span></button><button class="text-btn" id="logoutBtn"></button></div></div></header><main class="page"><section class="hero" style="min-height:250px"><div class="hero-copy" style="padding:35px"><div class="eyebrow">MM STAR DEALER</div><h1 style="font-size:48px" id="helloDealer"></h1><p id="dealerHero"></p></div><div class="hero-visual"><img src="assets/logo.jpg"></div></section><section class="section"><div class="section-head"><div><h2 id="catTitle"></h2></div></div><div class="subchips" id="categoryChips"></div></section><section class="section"><div class="section-head"><div><h2 id="productsTitle"></h2><p id="productsSub"></p></div></div><div class="product-grid" id="products"></div></section><section class="section hidden" id="ordersSection"><div class="section-head"><div><h2 id="ordersTitle"></h2></div><button class="btn btn-light" id="backProducts"></button></div><div id="orderList"></div></section></main></section>
<aside class="drawer" id="cartDrawer"><div class="drawer-head"><h2 id="cartTitle"></h2><button class="close-btn" id="cartClose">✕</button></div><div id="cartItems"></div><div class="cart-summary"><div class="summary-line total"><span id="totalLabel"></span><b id="cartTotal"></b></div></div><div class="field" style="margin-top:12px"><label id="payLabel"></label><select id="payment"><option value="invoice">Invoice</option><option value="bank">Bank transfer</option></select></div><button class="btn btn-primary" id="createOrder" style="width:100%;margin-top:12px"></button></aside><div class="toast" id="toast"></div>
<script src="config.js"></script><script>
const $=id=>document.getElementById(id),apiBase=window.MMSTAR_CONFIG.apiBase||'/api';let token=sessionStorage.getItem('dealerToken')||'',lang=localStorage.getItem('mmDealerLang')||'ka',dealer='',products=[],categories=[],selectedCat='',cart=JSON.parse(sessionStorage.getItem('dealerCart')||'[]');
const T={ka:{login:'დილერის შესვლა',user:'მომხმარებელი',pass:'პაროლი',signin:'შესვლა',logout:'გასვლა',hello:'გამარჯობა,',hero:'იხილე შენთვის დაშვებული კატეგორიები, დილერის ფასები და შექმენი შეკვეთა პირდაპირ პორტალიდან.',cats:'კატეგორიები',all:'ყველა',products:'დილერის პროდუქტები',productsSub:'საცალო და დილერის ფასები ერთ სივრცეში',search:'ძებნა სახელით ან კოდით',retail:'საცალო',dealerPrice:'დილერის ფასი',difference:'სხვაობა',stock:'მარაგი',add:'კალათაში',sold:'გათავდა',orders:'ჩემი შეკვეთები',back:'პროდუქტებზე დაბრუნება',cart:'დილერის კალათა',remove:'წაშლა',total:'სულ',payment:'გადახდის ტიპი',create:'შეკვეთის შექმნა',created:'შეკვეთა შეიქმნა',empty:'კალათა ცარიელია',noProducts:'პროდუქტები არ არის',noOrders:'შეკვეთები ჯერ არ არის',pdf:'PDF ინვოისი',status:'სტატუსი'},en:{login:'Dealer Login',user:'Username',pass:'Password',signin:'Sign in',logout:'Sign out',hello:'Hello,',hero:'Browse your assigned categories, dealer pricing and place orders directly from the portal.',cats:'Categories',all:'All',products:'Dealer products',productsSub:'Retail and dealer pricing in one place',search:'Search by name or code',retail:'Retail',dealerPrice:'Dealer price',difference:'Difference',stock:'Stock',add:'Add to cart',sold:'Out of stock',orders:'My orders',back:'Back to products',cart:'Dealer cart',remove:'Remove',total:'Total',payment:'Payment type',create:'Create order',created:'Order created',empty:'Cart is empty',noProducts:'No products available',noOrders:'No orders yet',pdf:'PDF invoice',status:'Status'},tr:{login:'Bayi Girişi',user:'Kullanıcı adı',pass:'Şifre',signin:'Giriş',logout:'Çıkış',hello:'Merhaba,',hero:'Size açık kategorileri, bayi fiyatlarını görüntüleyin ve portal üzerinden sipariş oluşturun.',cats:'Kategoriler',all:'Tümü',products:'Bayi ürünleri',productsSub:'Perakende ve bayi fiyatları bir arada',search:'Ad veya kod ile ara',retail:'Perakende',dealerPrice:'Bayi fiyatı',difference:'Fark',stock:'Stok',add:'Sepete ekle',sold:'Tükendi',orders:'Siparişlerim',back:'Ürünlere dön',cart:'Bayi sepeti',remove:'Sil',total:'Toplam',payment:'Ödeme türü',create:'Sipariş oluştur',created:'Sipariş oluşturuldu',empty:'Sepet boş',noProducts:'Ürün yok',noOrders:'Henüz sipariş yok',pdf:'PDF fatura',status:'Durum'}};const STATUS={ka:{NEW:'ახალი',CONFIRMED:'დადასტურებული',PAID:'გადახდილი',PROCESSING:'მუშავდება',READY:'მზადაა',SHIPPED:'გაგზავნილია',DELIVERED:'ჩაბარებულია',CANCELLED:'გაუქმებული'},en:{NEW:'New',CONFIRMED:'Confirmed',PAID:'Paid',PROCESSING:'Processing',READY:'Ready',SHIPPED:'Shipped',DELIVERED:'Delivered',CANCELLED:'Cancelled'},tr:{NEW:'Yeni',CONFIRMED:'Onaylandı',PAID:'Ödendi',PROCESSING:'İşleniyor',READY:'Hazır',SHIPPED:'Gönderildi',DELIVERED:'Teslim edildi',CANCELLED:'İptal edildi'}};const statusText=o=>STATUS[lang][o.statusCode]||o.status||'';
const t=k=>T[lang][k]||k,money=n=>`${Number(n||0).toFixed(2)} ₾`,esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),ah=()=>({authorization:'Bearer '+token,'content-type':'application/json'});
async function api(path,opt={}){const r=await fetch(apiBase+'/'+path,opt),d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw new Error(d.error||`HTTP_${r.status}`);return d}function toast(m){$('toast').textContent=m;$('toast').style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').style.display='none',2500)}function saveCart(){sessionStorage.setItem('dealerCart',JSON.stringify(cart));renderCart()}
function apply(){document.documentElement.lang=lang;document.querySelectorAll('.flag-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));$('loginTitle').textContent=t('login');$('loginUser').placeholder=t('user');$('loginPass').placeholder=t('pass');$('loginBtn').textContent=t('signin');$('logoutBtn').textContent=t('logout');$('ordersBtn').textContent=t('orders');$('helloDealer').textContent=t('hello')+' '+dealer;$('dealerHero').textContent=t('hero');$('catTitle').textContent=t('cats');$('productsTitle').textContent=t('products');$('productsSub').textContent=t('productsSub');$('search').placeholder=t('search');$('ordersTitle').textContent=t('orders');$('backProducts').textContent=t('back');$('cartTitle').textContent=t('cart');$('totalLabel').textContent=t('total');$('payLabel').textContent=t('payment');$('createOrder').textContent=t('create');renderCats();renderProducts();renderCart()}
async function login(){try{const d=await api('dealer/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:$('loginUser').value.trim(),password:$('loginPass').value})});token=d.token;dealer=d.dealer.name||'';sessionStorage.setItem('dealerToken',token);if(!localStorage.getItem('mmDealerLang')&&d.dealer.preferredLanguage)lang=d.dealer.preferredLanguage;show();await loadCatalog()}catch(e){toast(e.message)}}function show(){$('loginView').classList.add('hidden');$('dealerView').classList.remove('hidden');apply()}function logout(){sessionStorage.removeItem('dealerToken');sessionStorage.removeItem('dealerCart');location.reload()}
async function loadCatalog(){try{const d=await api('dealer/catalog',{headers:ah()});products=d.products||[];categories=d.categories||[];dealer=d.dealer?.name||dealer;apply()}catch(e){if(e.message==='AUTH_REQUIRED')logout();else toast(e.message)}}function tops(){return categories.filter(c=>!c.parentId)}function renderCats(){if(!$('categoryChips'))return;const ids=new Set(products.map(p=>p.categoryId));const cats=tops().filter(c=>ids.has(c.id));$('categoryChips').innerHTML=`<button class="chip ${!selectedCat?'active':''}" data-c="">${t('all')}</button>${cats.map(c=>`<button class="chip ${selectedCat===c.id?'active':''}" data-c="${c.id}">${c.emoji||''} ${esc(c.name)}</button>`).join('')}`;$('categoryChips').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{selectedCat=b.dataset.c;renderCats();renderProducts()})}
function renderProducts(){if(!$('products'))return;const q=String($('search').value||'').toLowerCase(),arr=products.filter(p=>(!selectedCat||p.categoryId===selectedCat)&&(!q||String(p.name||'').toLowerCase().includes(q)||String(p.code||'').toLowerCase().includes(q)));$('products').innerHTML=arr.length?arr.map(p=>`<article class="product-card"><div class="product-image"><img src="${esc(p.image||'assets/logo.jpg')}" onerror="this.src='assets/logo.jpg'"></div><div class="product-code">${esc(p.code)}</div><h3>${esc(p.name)}</h3><div class="muted">${t('retail')}: <s>${money(p.retailPrice)}</s></div><div class="price">${money(p.dealerPrice)}</div><div class="muted">${t('difference')}: ${money(p.difference)} • ${t('stock')}: ${p.stock||0}</div><button class="btn btn-primary" style="width:100%;margin-top:10px" data-add="${p.id}" ${Number(p.stock||0)<=0?'disabled':''}>${Number(p.stock||0)<=0?t('sold'):t('add')}</button></article>`).join(''):`<div class="empty">${t('noProducts')}</div>`;$('products').querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addCart(b.dataset.add))}
function addCart(id){const p=products.find(x=>x.id===id);let x=cart.find(x=>x.id===id);if(x)x.qty=Math.min(Number(p.stock||0),x.qty+1);else cart.push({id:p.id,name:p.name,image:p.image||'',price:Number(p.dealerPrice),stock:Number(p.stock||0),qty:1});saveCart();const b=document.querySelector(`[data-add="${CSS.escape(id)}"]`);if(b){const old=b.textContent;b.textContent='✓ '+t('add');b.classList.add('added');setTimeout(()=>{b.textContent=old;b.classList.remove('added')},1000)}toast(t('add'))}function renderCart(){if(!$('cartItems'))return;$('cartCount').textContent=cart.reduce((a,x)=>a+x.qty,0);$('cartItems').innerHTML=cart.length?cart.map(x=>`<div class="cart-item"><img src="${esc(x.image||'assets/logo.jpg')}" onerror="this.src='assets/logo.jpg'"><div><b>${esc(x.name)}</b><div>${money(x.price)}</div><div class="qty-control"><button data-q="${x.id}" data-n="-1">−</button><span>${x.qty}</span><button data-q="${x.id}" data-n="1">+</button></div></div><button class="btn btn-danger btn-sm" data-rm="${x.id}">${t('remove')}</button></div>`).join(''):`<div class="empty">${t('empty')}</div>`;$('cartTotal').textContent=money(cart.reduce((a,x)=>a+x.price*x.qty,0));$('createOrder').disabled=!cart.length;$('cartItems').querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const x=cart.find(i=>i.id===b.dataset.q);x.qty=Math.max(1,Math.min(x.stock||999,x.qty+Number(b.dataset.n)));saveCart()});$('cartItems').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{cart=cart.filter(x=>x.id!==b.dataset.rm);saveCart()})}function openCart(){$('cartDrawer').classList.add('open')}function closeCart(){$('cartDrawer').classList.remove('open')}
async function createOrder(){if(!cart.length)return;try{$('createOrder').disabled=true;const d=await api('dealer/orders',{method:'POST',headers:ah(),body:JSON.stringify({items:cart.map(x=>({id:x.id,qty:x.qty})),paymentMethod:$('payment').value,language:lang})});cart=[];saveCart();closeCart();toast(t('created')+': '+d.invoice);await showOrders()}catch(e){toast(e.message)}finally{$('createOrder').disabled=!cart.length}}
async function showOrders(){try{const d=await api('dealer/orders',{headers:ah()});$('productsSection')?.classList?.add('hidden');$('ordersSection').classList.remove('hidden');$('orderList').innerHTML=d.orders.length?d.orders.map(o=>`<article class="order-card"><div class="card-row"><div><b>${esc(o.invoice)}</b><div class="muted">${o.createdAt?new Date((o.createdAt._seconds||0)*1000).toLocaleString():''}</div></div><span class="status-pill">${esc(statusText(o))}</span></div><div class="order-products">${(o.items||[]).map(i=>`<div class="order-product"><img src="${esc(i.image||'assets/logo.jpg')}" onerror="this.src='assets/logo.jpg'"><div><b>${esc(i.name)}</b><div class="muted">${i.qty} × ${money(i.price)}</div></div><b>${money(i.total)}</b></div>`).join('')}</div><div class="card-row" style="margin-top:10px"><b>${money(o.total)}</b><button class="btn btn-light btn-sm" data-pdf="${esc(o.invoice)}">${t('pdf')}</button></div></article>`).join(''):`<div class="empty">${t('noOrders')}</div>`;$('orderList').querySelectorAll('[data-pdf]').forEach(b=>b.onclick=()=>open(apiBase+'/invoice/'+encodeURIComponent(b.dataset.pdf),'_blank'));$('products').closest('.section').classList.add('hidden')}catch(e){toast(e.message)}}function showProducts(){$('ordersSection').classList.add('hidden');$('products').closest('.section').classList.remove('hidden')}
$('loginBtn').onclick=login;$('loginPass').onkeydown=e=>{if(e.key==='Enter')login()};$('logoutBtn').onclick=logout;$('ordersBtn').onclick=showOrders;$('backProducts').onclick=showProducts;$('cartBtn').onclick=openCart;$('cartClose').onclick=closeCart;$('createOrder').onclick=createOrder;$('search').oninput=renderProducts;document.querySelectorAll('.flag-btn').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem('mmDealerLang',lang);apply()});if(token){show();loadCatalog()}else apply();
</script></body></html>
