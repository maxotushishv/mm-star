<!doctype html><html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MM STAR Dealer</title><style>
:root{--r:#e61928}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f7f7f7}.top{background:#111;color:#fff;padding:12px 4vw;display:flex;align-items:center;gap:14px}.logo{width:95px;height:46px;object-fit:contain;background:#fff;border-radius:10px}.wrap{max-width:1150px;margin:auto;padding:24px 4vw}.card{background:#fff;border:1px solid #e7e7e7;border-radius:16px;padding:18px}.form{display:grid;gap:10px;max-width:420px}.form input{padding:11px;border:1px solid #ddd;border-radius:10px}.btn{border:0;border-radius:10px;padding:10px 14px;background:#111;color:#fff;cursor:pointer}.red{background:var(--r)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.muted{color:#777}.hidden{display:none}.lang{margin-left:auto;display:flex;gap:6px}.lang button{border:0;border-radius:999px;padding:8px 10px;cursor:pointer}
</style></head><body><header class="top"><img src="assets/logo.jpg" class="logo"><strong>MM STAR Dealer</strong><div class="lang"><button onclick="setLang('ka')">🇬🇪</button><button onclick="setLang('en')">🇬🇧</button><button onclick="setLang('tr')">🇹🇷</button></div><button class="btn" onclick="location.href='index.html'">Store</button></header><main class="wrap"><section id="login" class="card"><h2>Dealer Login</h2><div class="form"><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button class="btn red" onclick="doLogin()">შესვლა</button></div></section><section id="app" class="hidden"><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px"><button class="btn red" onclick="catalog()">პროდუქტები</button><button class="btn" onclick="history()">შეკვეთები</button><button class="btn" onclick="logout()">გასვლა</button></div><div id="panel"></div></section></main><script src="config.js"></script><script>
const apiBase=window.MMSTAR_CONFIG.apiBase||'/api';let token=sessionStorage.dealerToken||'';const ah=()=>({authorization:'Bearer '+token,'content-type':'application/json'});async function api(path,opt={}){const r=await fetch(apiBase+'/'+path,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'ERROR');return d}function setLang(v){localStorage.mmDealerLang=v}async function doLogin(){try{const d=await api('dealer/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});token=d.token;sessionStorage.dealerToken=token;show();catalog()}catch(e){alert(e.message)}}function show(){login.classList.add('hidden');app.classList.remove('hidden')}function logout(){sessionStorage.removeItem('dealerToken');location.reload()}async function catalog(){const d=await api('dealer/catalog',{headers:ah()});panel.innerHTML=`<h2>${d.dealer?.name||'Dealer'}</h2><div class="grid">${d.products.map(x=>`<div class="card"><h3>${x.name||''}</h3><div class="muted">${x.code||''}</div><p>საცალო: ${x.retailPrice||0} ₾</p><p><b>დილერი: ${x.dealerPrice||0} ₾</b></p><p>სხვაობა: ${x.difference||0} ₾</p><p>მარაგი: ${x.stock||0}</p></div>`).join('')}</div>`}async function history(){const d=await api('dealer/orders',{headers:ah()});panel.innerHTML=`<div class="card"><h2>შეკვეთები</h2>${d.orders.map(x=>`<p><b>${x.invoice||''}</b> — ${x.status||''} — ${x.total||0} ₾</p>`).join('')}</div>`}if(token){show();catalog().catch(()=>logout())}
</script></body></html>
