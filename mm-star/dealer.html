<!doctype html><html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MM STAR Dealer</title><style>
:root{--r:#e51b2b;--bg:#f6f6f8;--line:#e7e7eb;--muted:#74747d}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#17171a}button,input,select{font:inherit}.top{position:sticky;top:0;z-index:20;background:#111;color:#fff;padding:11px 4vw;display:flex;align-items:center;gap:13px}.logo{width:95px;height:44px;object-fit:contain;background:#fff;border-radius:10px}.brand{font-weight:800}.flags{margin-left:auto;display:flex;gap:6px}.flag{width:38px;height:38px;border:1px solid #ffffff33;border-radius:50%;background:#202024;cursor:pointer;font-size:19px}.flag.active{outline:2px solid #fff}.wrap{max-width:1200px;margin:auto;padding:22px 4vw}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 7px 24px #0000000a}.login{max-width:440px;margin:8vh auto}.form{display:grid;gap:10px}.form input,.form select{padding:11px;border:1px solid #ddd;border-radius:11px}.btn{border:0;border-radius:11px;padding:10px 14px;cursor:pointer;background:#111;color:#fff;font-weight:700}.btn.red{background:var(--r)}.btn.light{background:#f0f0f2;color:#111}.btn.danger{background:#fff0f2;color:#bd1624}.btn:disabled{opacity:.45}.hidden{display:none!important}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tabs .active{background:var(--r)}.toolbar{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}.toolbar input{padding:11px;border:1px solid #ddd;border-radius:11px;min-width:min(330px,100%)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.prod img{width:100%;height:155px;object-fit:contain;border-radius:12px;background:#fafafa}.price{font-size:20px;font-weight:800}.muted{color:var(--muted)}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#f1f1f3;font-size:12px}.drawer{position:fixed;right:0;top:0;width:min(450px,100%);height:100%;z-index:50;background:#fff;padding:18px;overflow:auto;box-shadow:-8px 0 35px #0004;transform:translateX(100%);transition:.25s}.drawer.open{transform:none}.row{display:flex;align-items:center;gap:10px;justify-content:space-between}.qty{display:flex;align-items:center;gap:8px}.empty{text-align:center;color:#777;padding:25px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:100;background:#111;color:#fff;padding:11px 16px;border-radius:11px;display:none}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:left}@media(max-width:700px){.wrap{padding:16px}.logo{width:80px}.toolbar input{width:100%;min-width:0}}</style></head><body>
<header class="top"><img src="assets/logo.jpg" class="logo"><div class="brand">MM STAR <span id="dealerWord"></span></div><div class="flags"><button id="f-ka" class="flag" onclick="setLang('ka')">🇬🇪</button><button id="f-en" class="flag" onclick="setLang('en')">🇬🇧</button><button id="f-tr" class="flag" onclick="setLang('tr')">🇹🇷</button></div></header>
<main class="wrap"><section id="loginBox" class="card login"><h2 id="loginTitle"></h2><div class="form"><input id="u" autocomplete="username"><input id="p" type="password" autocomplete="current-password"><button id="loginBtn" class="btn red" onclick="doLogin()"></button></div></section><section id="app" class="hidden"><div id="tabs" class="tabs"></div><div id="panel"></div></section></main>
<div id="cartDrawer" class="drawer"><div class="row"><h2 id="cartTitle"></h2><button class="btn" onclick="closeCart()">✕</button></div><div id="cartItems"></div><hr><div class="row"><b id="totalLabel"></b><b id="cartTotal">0 ₾</b></div><select id="paymentMethod" style="width:100%;margin-top:12px;padding:11px;border:1px solid #ddd;border-radius:11px"><option value="invoice">Invoice</option><option value="bank">Bank transfer</option></select><button id="orderBtn" class="btn red" style="width:100%;margin-top:12px" onclick="createOrder()"></button></div><div id="toast" class="toast"></div>
<script src="config.js"></script><script>
const apiBase=window.MMSTAR_CONFIG.apiBase||'/api';let token=sessionStorage.getItem('dealerToken')||'',lang=localStorage.getItem('mmDealerLang')||'ka',products=[],cart=JSON.parse(sessionStorage.getItem('dealerCart')||'[]'),current='products',dealerName='';
const L={ka:{dealer:'დილერი',login:'დილერის შესვლა',user:'მომხმარებელი',pass:'პაროლი',signin:'შესვლა',products:'პროდუქტები',orders:'შეკვეთები',logout:'გასვლა',search:'ძებნა სახელით ან კოდით',retail:'საცალო',dealerPrice:'დილერის ფასი',difference:'სხვაობა',stock:'მარაგი',add:'კალათაში',sold:'გათავდა',cart:'დილერის კალათა',empty:'კალათა ცარიელია',remove:'წაშლა',total:'სულ',create:'შეკვეთის შექმნა',created:'შეკვეთა შეიქმნა',invoice:'ინვოისი',status:'სტატუსი',date:'თარიღი',pdf:'PDF ინვოისი',noProducts:'პროდუქტები არ არის',noOrders:'შეკვეთები არ არის'},en:{dealer:'Dealer',login:'Dealer Login',user:'Username',pass:'Password',signin:'Sign in',products:'Products',orders:'Orders',logout:'Sign out',search:'Search by name or code',retail:'Retail',dealerPrice:'Dealer price',difference:'Difference',stock:'Stock',add:'Add to cart',sold:'Out of stock',cart:'Dealer Cart',empty:'Cart is empty',remove:'Remove',total:'Total',create:'Create order',created:'Order created',invoice:'Invoice',status:'Status',date:'Date',pdf:'PDF invoice',noProducts:'No products',noOrders:'No orders'},tr:{dealer:'Bayi',login:'Bayi Girişi',user:'Kullanıcı adı',pass:'Şifre',signin:'Giriş',products:'Ürünler',orders:'Siparişler',logout:'Çıkış',search:'Ad veya kod ile ara',retail:'Perakende',dealerPrice:'Bayi fiyatı',difference:'Fark',stock:'Stok',add:'Sepete ekle',sold:'Tükendi',cart:'Bayi Sepeti',empty:'Sepet boş',remove:'Sil',total:'Toplam',create:'Sipariş oluştur',created:'Sipariş oluşturuldu',invoice:'Fatura',status:'Durum',date:'Tarih',pdf:'PDF fatura',noProducts:'Ürün yok',noOrders:'Sipariş yok'}};const t=k=>L[lang][k]||k,money=n=>Number(n||0).toFixed(2)+' ₾',ah=()=>({authorization:'Bearer '+token,'content-type':'application/json'});async function api(path,opt={}){let r=await fetch(apiBase+'/'+path,opt),d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw new Error(d.error||'ERROR');return d}function say(m){toast.textContent=m;toast.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>toast.style.display='none',2300)}
function setLang(v){lang=v;localStorage.mmDealerLang=v;apply();if(token)openTab(current)}function apply(){document.documentElement.lang=lang;dealerWord.textContent=t('dealer');loginTitle.textContent=t('login');u.placeholder=t('user');p.placeholder=t('pass');loginBtn.textContent=t('signin');cartTitle.textContent=t('cart');totalLabel.textContent=t('total');orderBtn.textContent=t('create');['ka','en','tr'].forEach(x=>document.getElementById('f-'+x).classList.toggle('active',x===lang));renderTabs();renderCart()}function renderTabs(){if(!token)return;tabs.innerHTML=`<button class="btn ${current==='products'?'active':''}" onclick="openTab('products')">${t('products')}</button><button class="btn ${current==='orders'?'active':''}" onclick="openTab('orders')">${t('orders')}</button><button class="btn" onclick="openCart()">${t('cart')} <span>${cart.reduce((a,x)=>a+x.qty,0)}</span></button><button class="btn" onclick="logout()">${t('logout')}</button>`}function persist(){sessionStorage.dealerCart=JSON.stringify(cart);renderTabs();renderCart()}
async function doLogin(){try{let d=await api('dealer/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:u.value.trim(),password:p.value})});token=d.token;dealerName=d.dealer?.name||'';sessionStorage.dealerToken=token;showApp();openTab('products')}catch(e){say(e.message)}}function showApp(){loginBox.classList.add('hidden');app.classList.remove('hidden');renderTabs()}function logout(){sessionStorage.removeItem('dealerToken');sessionStorage.removeItem('dealerCart');location.reload()}async function openTab(v){current=v;renderTabs();try{v==='products'?await catalog():await history()}catch(e){if(e.message==='AUTH_REQUIRED')return logout();say(e.message)}}
async function catalog(){let d=await api('dealer/catalog',{headers:ah()});products=d.products||[];dealerName=d.dealer?.name||dealerName;panel.innerHTML=`<div class="card"><div class="toolbar"><div><h2 style="margin:0">${dealerName||'MM STAR'}</h2><div class="muted">${t('products')}</div></div><input id="q" placeholder="${t('search')}" oninput="renderProducts()"></div><div id="productGrid" class="grid"></div></div>`;renderProducts()}function renderProducts(){let qv=(document.getElementById('q')?.value||'').toLowerCase(),a=products.filter(x=>(x.name||'').toLowerCase().includes(qv)||(x.code||'').toLowerCase().includes(qv));productGrid.innerHTML=a.length?a.map(x=>`<article class="card prod"><img src="${x.image||'assets/logo.jpg'}" onerror="this.src='assets/logo.jpg'"><div class="muted">${x.code||''}</div><h3>${x.name||''}</h3><div>${t('retail')}: ${money(x.retailPrice)}</div><div class="price">${t('dealerPrice')}: ${money(x.dealerPrice)}</div><div>${t('difference')}: ${money(x.difference)}</div><div class="muted">${t('stock')}: ${x.stock||0}</div><button class="btn red" ${Number(x.stock)<=0?'disabled':''} onclick="addCart('${x.id}')">${Number(x.stock)<=0?t('sold'):t('add')}</button></article>`).join(''):`<div class="empty">${t('noProducts')}</div>`}
function addCart(id){let p=products.find(x=>x.id===id),x=cart.find(i=>i.id===id);if(x)x.qty=Math.min(Number(p.stock),x.qty+1);else cart.push({id,qty:1,name:p.name,price:Number(p.dealerPrice),stock:Number(p.stock)});persist();say(t('add'))}function openCart(){cartDrawer.classList.add('open');renderCart()}function closeCart(){cartDrawer.classList.remove('open')}function renderCart(){if(!cartItems)return;cartItems.innerHTML=cart.length?cart.map(x=>`<div class="card" style="margin:8px 0"><div class="row"><b>${x.name}</b><button class="btn danger" onclick="removeCart('${x.id}')">${t('remove')}</button></div><div class="row"><span>${money(x.price)}</span><span class="qty"><button class="btn light" onclick="changeQty('${x.id}',-1)">−</button>${x.qty}<button class="btn light" onclick="changeQty('${x.id}',1)">+</button></span></div></div>`).join(''):`<div class="empty">${t('empty')}</div>`;cartTotal.textContent=money(cart.reduce((a,x)=>a+x.price*x.qty,0));orderBtn.disabled=!cart.length}function changeQty(id,n){let x=cart.find(i=>i.id===id);x.qty=Math.max(1,Math.min(x.stock||999,x.qty+n));persist()}function removeCart(id){cart=cart.filter(x=>x.id!==id);persist()}
async function createOrder(){if(!cart.length)return;try{let d=await api('dealer/orders',{method:'POST',headers:ah(),body:JSON.stringify({items:cart.map(x=>({id:x.id,qty:x.qty})),paymentMethod:paymentMethod.value})});cart=[];persist();closeCart();say(t('created')+': '+d.invoice);current='orders';renderTabs();await history()}catch(e){say(e.message)}}async function history(){let d=await api('dealer/orders',{headers:ah()}),a=d.orders||[];panel.innerHTML=`<div class="card"><h2>${t('orders')}</h2><div class="tablewrap"><table class="table"><tr><th>${t('invoice')}</th><th>${t('date')}</th><th>${t('status')}</th><th>${t('total')}</th><th></th></tr>${a.length?a.map(o=>`<tr><td><b>${o.invoice||''}</b></td><td>${o.createdAt?new Date((o.createdAt._seconds||0)*1000).toLocaleString():''}</td><td><span class="badge">${o.status||''}</span></td><td>${money(o.total)}</td><td><button class="btn" onclick="openInvoice('${o.invoice}')">${t('pdf')}</button></td></tr>`).join(''):`<tr><td colspan="5" class="empty">${t('noOrders')}</td></tr>`}</table></div></div>`}function openInvoice(i){open(apiBase+'/invoice/'+encodeURIComponent(i),'_blank')}apply();if(token){showApp();openTab('products')}
</script></body></html>
