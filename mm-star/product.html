<!doctype html><html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MM STAR — Product</title><link rel="icon" href="assets/logo.jpg"><link rel="stylesheet" href="site.css"></head><body><header class="site-header"><div class="header-inner"><a class="btn btn-light" href="index.html">← <span id="backText">უკან</span></a><a href="index.html"><img class="brand-logo" src="assets/logo.jpg"></a><div class="header-actions"><div class="flags always"><button class="flag-btn" data-lang="ka">🇬🇪</button><button class="flag-btn" data-lang="en">🇬🇧</button><button class="flag-btn" data-lang="ru">🇷🇺</button><button class="flag-btn" data-lang="tr">🇹🇷</button></div><a class="icon-btn" href="index.html#cart">🛒</a></div></div></header><main class="page"><div id="detail"></div></main><div class="toast" id="toast"></div><script src="config.js"></script><script type="module">
const $=id=>document.getElementById(id),cfg=window.MMSTAR_CONFIG,esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),money=n=>`${Number(n||0).toFixed(2)} ₾`;let lang=localStorage.getItem('mmLang')||'ka',product=null;const T={ka:{back:'მაღაზიაში დაბრუნება',stock:'მარაგი',add:'კალათაში დამატება',added:'დამატებულია ✓',desc:'აღწერა',code:'პროდუქტის კოდი',sale:'აქცია',sold:'გათავდა'},en:{back:'Back to store',stock:'Stock',add:'Add to cart',added:'Added ✓',desc:'Description',code:'Product code',sale:'Sale',sold:'Out of stock'},ru:{back:'Назад в магазин',stock:'Остаток',add:'В корзину',added:'Добавлено ✓',desc:'Описание',code:'Код товара',sale:'Акция',sold:'Нет в наличии'},tr:{back:'Mağazaya dön',stock:'Stok',add:'Sepete ekle',added:'Eklendi ✓',desc:'Açıklama',code:'Ürün kodu',sale:'İndirim',sold:'Tükendi'}};const t=k=>T[lang][k]||k;function toast(m){$('toast').textContent=m;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1800)}function render(){if(!product)return;$('backText').textContent=t('back');document.querySelectorAll('.flag-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));const ep=Number((product.effectivePrice??product.price)||0),sale=product.saleActive&&ep<Number(product.price||0);$('detail').innerHTML=`<section class="product-detail-card"><div class="product-detail-image"><img src="${esc(product.image||'assets/logo.jpg')}" onerror="this.src='assets/logo.jpg'"></div><div class="product-detail-info">${sale?`<div class="sale-ribbon">${t('sale')} ${product.discountPercent?'-'+product.discountPercent+'%':''}</div>`:''}<div class="product-code">${t('code')}: ${esc(product.code||'')}</div><h1>${esc(product.name||'')}</h1>${sale?`<div class="detail-price"><s>${money(product.price)}</s><strong>${money(ep)}</strong></div>`:`<div class="detail-price"><strong>${money(ep)}</strong></div>`}<div class="stock big">${t('stock')}: ${Number(product.stock||0)}</div><button id="addBtn" class="btn btn-primary" ${Number(product.stock||0)<=0?'disabled':''}>${Number(product.stock||0)<=0?t('sold'):t('add')}</button><hr><h3>${t('desc')}</h3><p class="product-description">${esc(product.description||'')}</p></div></section>`;$('addBtn').onclick=add}function add(){let cart=JSON.parse(localStorage.getItem('mmCart')||'[]'),x=cart.find(x=>x.id===product.id),price=Number((product.effectivePrice??product.price)||0);if(x){x.qty=Math.min(Number(product.stock||0),x.qty+1);x.price=price}else cart.push({id:product.id,name:product.name,price,image:product.image||'',qty:1,stock:Number(product.stock||0),weightKg:Number(product.weightKg||1)});localStorage.setItem('mmCart',JSON.stringify(cart));$('addBtn').textContent=t('added');$('addBtn').classList.add('added');toast(t('added'))}async function load(){const r=await fetch(cfg.apiBase+'/catalog'),d=await r.json(),id=new URLSearchParams(location.search).get('id');product=(d.products||[]).find(x=>x.id===id);if(!product){$('detail').innerHTML='<div class="empty">Product not found</div>';return}render()}document.querySelectorAll('.flag-btn').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem('mmLang',lang);render()});load();</script></body></html>
