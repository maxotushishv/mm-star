function openSide(){$('sideOverlay').classList.add('open')}function closeSide(){$('sideOverlay').classList.remove('open')}function openCart(){$('cartDrawer').classList.add('open')}function closeCart(){$('cartDrawer').classList.remove('open')}function modal(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modalBack').classList.add('open')}function closeModal(){$('modalBack').classList.remove('open')}
function normalizePhone(v){let d=String(v||'').replace(/\D/g,'');if(/^5\d{8}$/.test(d))return'995'+d;if(/^05\d{8}$/.test(d))return'995'+d.slice(1);if(/^9955\d{8}$/.test(d))return d;return d}
function loginModal(){modal(t('auth'),`<div class="otp-card"><div class="otp-icon">🔐</div><h3>${t('secureOtp')}</h3><p>${t('otpHint')}</p><div class="otp-phone modern"><div class="phone-prefix">🇬🇪 +995</div><input id="loginPhone" inputmode="numeric" autocomplete="tel" maxlength="12" placeholder="${t('phone')}"></div><button class="btn btn-primary otp-submit" id="sendOtpBtn">${t('sendOtp')} →</button><div id="otpZone"></div><div class="otp-security">✓ MM STAR • SMS OTP • 5 min</div></div>`);$('sendOtpBtn').onclick=sendOtp}
async function sendOtp(){try{const p=normalizePhone($('loginPhone').value);await api('otp/send',{method:'POST',body:JSON.stringify({phone:p})});$('otpZone').innerHTML=`<div class="otp-code-zone"><input id="otpCode" class="otp-code-input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="• • • • • •"><button class="btn btn-dark" id="verifyBtn">${t('verify')}</button></div>`;$('verifyBtn').onclick=()=>verifyOtp(p);toast(t('sent'))}catch(e){toast(e.message)}}
async function verifyOtp(phone){try{const d=await api('otp/verify',{method:'POST',body:JSON.stringify({phone,code:$('otpCode').value})});await signInWithCustomToken(auth,d.token);closeModal();if(d.isNew)editProfile(true);else toast(t('profile'))}catch(e){toast(e.message)}}
async function loadProfile(){if(!auth.currentUser)return null;const tok=await auth.currentUser.getIdToken(),d=await api('profile',{headers:{authorization:'Bearer '+tok}});state.profile=d.profile;return d.profile}
async function profileModal(){try{const p=await loadProfile()||{};modal(t('profile'),`<div class="form"><div class="card" style="box-shadow:none"><h3 style="margin-top:0">${esc((p.firstName||'')+' '+(p.lastName||''))}</h3><p>☎ ${esc(p.phone||auth.currentUser?.phoneNumber||'')}</p><p>✉ ${esc(p.email||'')}</p><p>📍 ${esc(p.address||'')}</p></div><button class="btn btn-light" id="editProfileBtn">${t('editProfile')}</button><button class="btn btn-dark" id="ordersBtn">${t('myOrders')}</button><button class="btn btn-danger" id="logoutBtn">${t('logout')}</button></div>`);$('editProfileBtn').onclick=()=>editProfile(false);$('ordersBtn').onclick=myOrders;$('logoutBtn').onclick=async()=>{await signOut(auth);closeModal()}}catch(e){toast(e.message)}}
function editProfile(first){const p=state.profile||{};modal(first?t('register'):t('editProfile'),`<div class="form"><div class="form-grid"><div class="field"><label>${t('first')}</label><input id="pfFirst" value="${esc(p.firstName||'')}"></div><div class="field"><label>${t('last')}</label><input id="pfLast" value="${esc(p.lastName||'')}"></div></div><div class="field"><label>${t('email')}</label><input id="pfEmail" type="email" value="${esc(p.email||'')}"></div><div class="field"><label>${t('address')}</label><textarea id="pfAddress">${esc(p.address||'')}</textarea></div><button class="btn btn-primary" id="saveProfileBtn">${t('save')}</button></div>`);$('saveProfileBtn').onclick=saveProfile}
async function saveProfile(){try{const tok=await auth.currentUser.getIdToken();await api('profile',{method:'POST',headers:{authorization:'Bearer '+tok},body:JSON.stringify({firstName:$('pfFirst').value,lastName:$('pfLast').value,email:$('pfEmail').value,address:$('pfAddress').value,preferredLanguage:lang})});await loadProfile();closeModal();toast(t('saved'))}catch(e){toast(e.message)}}
async function myOrders(){try{const tok=await auth.currentUser.getIdToken(),d=await api('orders',{headers:{authorization:'Bearer '+tok}});modal(t('myOrders'),d.orders.length?d.orders.map(o=>`<article class="order-card"><div class="card-row"><div><b>${esc(o.invoice)}</b><div class="muted">${o.createdAt?new Date((o.createdAt._seconds||0)*1000).toLocaleString():''}</div></div><span class="status-pill">${esc(statusText(o))}</span></div><div class="order-products">${(o.items||[]).map(i=>`<div class="order-product"><img src="${esc(i.image||'assets/logo.jpg')}" onerror="this.src='assets/logo.jpg'"><div><b>${esc(i.name)}</b><div class="muted">${i.qty} × ${money(i.price)}</div></div><b>${money(i.total)}</b></div>`).join('')}</div><div class="card-row" style="margin-top:12px"><b>${money(o.total)}</b><button class="btn btn-light btn-sm" data-pdf="${esc(o.invoice)}">${t('pdf')}</button></div></article>`).join(''):`<div class="empty">${t('noOrders')}</div>`);$('modalBody').querySelectorAll('[data-pdf]').forEach(b=>b.onclick=()=>window.open(cfg.apiBase+'/invoice/'+encodeURIComponent(b.dataset.pdf),'_blank'))}catch(e){toast(e.message)}}
async function load(){try{const d=await api('catalog');state.products=d.products||[];state.categories=d.categories||[];state.settings=d.settings||{};applyLanguage()}catch(e){toast(e.message)}}
$('menuBtn').onclick=openSide;$('sideClose').onclick=closeSide;$('sideOverlay').onclick=e=>{if(e.target===$('sideOverlay'))closeSide()};$('cartBtn').onclick=openCart;$('cartClose').onclick=closeCart;$('modalClose').onclick=closeModal;$('modalBack').onclick=e=>{if(e.target===$('modalBack'))closeModal()};$('heroShopBtn').onclick=()=>$('productsSection').scrollIntoView({behavior:'smooth'});$('heroContactBtn').onclick=()=>$('contactSection').scrollIntoView({behavior:'smooth'});$('authBtn').onclick=()=>state.user?profileModal():loginModal();document.querySelectorAll('.flag-btn').forEach(b=>b.onclick=async()=>{lang=b.dataset.lang;localStorage.setItem('mmLang',lang);applyLanguage();if(state.user){try{const p=await loadProfile()||{},tok=await auth.currentUser.getIdToken();await api('profile',{method:'POST',headers:{authorization:'Bearer '+tok},body:JSON.stringify({...p,preferredLanguage:lang})})}catch{}}});$('productSearch').oninput=()=>{ $('headerSearch').value=$('productSearch').value;renderProducts()};$('headerSearch').oninput=()=>{ $('productSearch').value=$('headerSearch').value;renderProducts();if($('headerSearch').value)$('productsSection').scrollIntoView({behavior:'smooth'})};onAuthStateChanged(auth,u=>{state.user=u;$('authBtnText').textContent=u?t('profile'):t('login');if(u)loadProfile().catch(()=>{})});renderCart();load();
</script></body></html>
