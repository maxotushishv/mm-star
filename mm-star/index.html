<!doctype html><html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MM STAR</title><link rel="icon" href="assets/logo.jpg"><style>
:root{--r:#e51b2b;--line:#e7e7eb;--muted:#74747d}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#17171a}button,input,select{font:inherit}.top{position:sticky;top:0;z-index:20;background:#111;color:#fff;padding:10px 4vw;display:flex;align-items:center;gap:12px}.logo{width:100px;height:46px;object-fit:contain;background:#fff;border-radius:10px}.nav{display:flex;gap:7px;align-items:center;flex:1;flex-wrap:wrap}.nav button,.pill{border:0;border-radius:999px;padding:9px 12px;cursor:pointer;background:#202024;color:#fff}.flags{margin-left:auto;display:flex;gap:5px}.flag{width:38px;height:38px;padding:0!important;font-size:19px}.flag.active{outline:2px solid #fff}.wrap{max-width:1200px;margin:auto;padding:24px 4vw}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:22px;align-items:center;padding:28px;border:1px solid #eee;border-radius:24px;background:linear-gradient(135deg,#fff,#fff0f2)}.hero img{width:100%;max-height:250px;object-fit:contain}.hero h1{font-size:clamp(38px,7vw,76px);margin:0}.hero b{color:var(--r)}.section{margin-top:28px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 7px 24px #0000000a}.card img{width:100%;height:170px;object-fit:contain;background:#fafafa;border-radius:12px}.price{font-size:21px;font-weight:800}.muted{color:var(--muted)}.btn{border:0;border-radius:11px;padding:10px 14px;cursor:pointer;background:#111;color:#fff;font-weight:700}.btn.red{background:var(--r)}.btn:disabled{opacity:.45}.toolbar,.row{display:flex;align-items:center;gap:10px;justify-content:space-between}.toolbar{flex-wrap:wrap}.toolbar input{min-width:min(340px,100%);padding:11px;border:1px solid #ddd;border-radius:11px}.drawer{position:fixed;right:0;top:0;height:100%;width:min(440px,100%);z-index:40;background:#fff;padding:18px;overflow:auto;box-shadow:-8px 0 35px #0004;transform:translateX(100%);transition:.25s}.drawer.open{transform:none}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal.open{display:flex}.box{background:#fff;border-radius:18px;padding:20px;width:min(590px,100%);max-height:90vh;overflow:auto}.form{display:grid;gap:10px}.form input,.form select{padding:11px;border:1px solid #ddd;border-radius:11px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:100;background:#111;color:#fff;padding:11px 16px;border-radius:11px;display:none;max-width:90vw}.qty{display:inline-flex;align-items:center;gap:8px}.empty{text-align:center;color:#777;padding:25px}@media(max-width:760px){.hero{grid-template-columns:1fr}.logo{width:82px}.wrap{padding:16px}.flags{width:100%;margin-left:0}.toolbar input{width:100%;min-width:0}.nav .hideMob{display:none}}
</style></head><body>
<header class="top"><img src="assets/logo.jpg" class="logo"><nav class="nav"><button id="navHome" onclick="showStore()"></button><button id="navProducts" class="hideMob" onclick="scrollToProducts()"></button><button id="navProfile" onclick="openProfile()"></button><button id="navCart" onclick="openCart()"><span id="navCartText"></span> <span id="cartCount">0</span></button><div class="flags"><button id="f-ka" class="pill flag" onclick="setLang('ka')">🇬🇪</button><button id="f-en" class="pill flag" onclick="setLang('en')">🇬🇧</button><button id="f-ru" class="pill flag" onclick="setLang('ru')">🇷🇺</button><button id="f-tr" class="pill flag" onclick="setLang('tr')">🇹🇷</button></div></nav></header>
<main><div class="wrap"><section class="hero"><div><div class="muted">MM STAR ONLINE STORE</div><h1>MM <b>STAR</b></h1><p id="heroText"></p><button id="heroBtn" class="btn red" onclick="scrollToProducts()"></button></div><img src="assets/logo.jpg"></section><section class="section"><h2 id="catTitle"></h2><div id="categories" class="grid"></div></section><section id="productsSection" class="section"><div class="toolbar"><h2 id="prodTitle"></h2><input id="search" oninput="renderProducts()"></div><div id="products" class="grid"></div></section></div></main>
<div id="cart" class="drawer"><div class="row"><h2 id="cartTitle"></h2><button class="btn" onclick="closeCart()">✕</button></div><div id="cartItems"></div><hr><div class="row"><b id="totalLabel"></b><b id="cartTotal">0 ₾</b></div><button id="checkoutBtn" class="btn red" style="width:100%;margin-top:14px" onclick="checkout()"></button></div>
<div id="modal" class="modal"><div class="box"><div class="row"><h2 id="modalTitle"></h2><button class="btn" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div><div id="toast" class="toast"></div>
<script src="config.js"></script><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import{getAuth,signInWithCustomToken,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';
const cfg=window.MMSTAR_CONFIG,auth=getAuth(initializeApp(cfg.firebase)),S={products:[],categories:[],cart:[],profile:null};let lang=localStorage.getItem('mmLang')||'ka';
const D={ka:{home:'მთავარი',products:'პროდუქტები',profile:'პროფილი',cart:'კალათა',hero:'ტექნიკა, აქსესუარები და მეტი — სწრაფი და უსაფრთხო შეკვეთით.',view:'პროდუქტების ნახვა',categories:'კატეგორიები',search:'ძებნა სახელით ან კოდით',stock:'მარაგი',add:'კალათაში დამატება',sold:'გათავდა',none:'პროდუქტი ვერ მოიძებნა.',noCats:'კატეგორიები ჯერ არ არის დამატებული.',added:'პროდუქტი დაემატა კალათაში',remove:'წაშლა',empty:'კალათა ცარიელია',total:'სულ',checkout:'შეკვეთის გაფორმება',auth:'ავტორიზაცია',phone:'5XX XX XX XX',send:'OTP კოდის გაგზავნა',code:'6 ციფრი',verify:'დადასტურება',sent:'OTP გაიგზავნა',loginOk:'ავტორიზაცია წარმატებულია',myProfile:'ჩემი პროფილი',edit:'ინფორმაციის შეცვლა',myOrders:'ჩემი შეკვეთები',logout:'გასვლა',register:'რეგისტრაცია',editProfile:'პროფილის რედაქტირება',first:'სახელი',last:'გვარი',email:'Email',address:'მისამართი',save:'შენახვა',saved:'შენახულია',noOrders:'შეკვეთები არ არის.',pdf:'PDF ინვოისი',payment:'გადახდის მეთოდი',keepz:'ბარათით გადახდა / განვადება — Keepz',bank:'საბანკო გადარიცხვა',invoice:'ინვოისი',branch:'ფილიალში გადახდა',delivery:'მიწოდება',pickup:'ფილიალიდან გატანა — თბილისი',offT:'თბილისში მიწოდება — დროებით მიუწვდომელი',offR:'რეგიონში მიწოდება — დროებით მიუწვდომელი',deliveryAddress:'მიწოდების მისამართი (საჭიროებისას)',create:'შეკვეთის შექმნა',created:'შეკვეთა წარმატებით შეიქმნა',redirect:'გადახდის გვერდზე გადავდივართ...',noUrl:'Keepz-მა გადახდის URL არ დააბრუნა.'},
en:{home:'Home',products:'Products',profile:'Profile',cart:'Cart',hero:'Technology, accessories and more — fast and secure ordering.',view:'View products',categories:'Categories',search:'Search by name or code',stock:'Stock',add:'Add to cart',sold:'Out of stock',none:'No products found.',noCats:'No categories yet.',added:'Added to cart',remove:'Remove',empty:'Cart is empty',total:'Total',checkout:'Checkout',auth:'Sign in',phone:'5XX XX XX XX',send:'Send OTP',code:'6 digits',verify:'Verify',sent:'OTP sent',loginOk:'Signed in',myProfile:'My profile',edit:'Edit information',myOrders:'My orders',logout:'Sign out',register:'Registration',editProfile:'Edit profile',first:'First name',last:'Last name',email:'Email',address:'Address',save:'Save',saved:'Saved',noOrders:'No orders yet.',pdf:'PDF invoice',payment:'Payment method',keepz:'Card / installment — Keepz',bank:'Bank transfer',invoice:'Invoice',branch:'Pay at branch',delivery:'Delivery',pickup:'Branch pickup — Tbilisi',offT:'Tbilisi delivery — unavailable',offR:'Regional delivery — unavailable',deliveryAddress:'Delivery address (if needed)',create:'Create order',created:'Order created',redirect:'Redirecting to payment...',noUrl:'Keepz did not return a payment URL.'},
ru:{home:'Главная',products:'Товары',profile:'Профиль',cart:'Корзина',hero:'Техника, аксессуары и другое — быстрый и безопасный заказ.',view:'Смотреть товары',categories:'Категории',search:'Поиск по названию или коду',stock:'Остаток',add:'В корзину',sold:'Нет в наличии',none:'Товары не найдены.',noCats:'Категорий пока нет.',added:'Добавлено в корзину',remove:'Удалить',empty:'Корзина пуста',total:'Итого',checkout:'Оформить заказ',auth:'Авторизация',phone:'5XX XX XX XX',send:'Отправить OTP',code:'6 цифр',verify:'Подтвердить',sent:'OTP отправлен',loginOk:'Вход выполнен',myProfile:'Мой профиль',edit:'Изменить данные',myOrders:'Мои заказы',logout:'Выйти',register:'Регистрация',editProfile:'Редактировать профиль',first:'Имя',last:'Фамилия',email:'Email',address:'Адрес',save:'Сохранить',saved:'Сохранено',noOrders:'Заказов нет.',pdf:'PDF инвойс',payment:'Способ оплаты',keepz:'Карта / рассрочка — Keepz',bank:'Банковский перевод',invoice:'Инвойс',branch:'Оплата в филиале',delivery:'Доставка',pickup:'Самовывоз — Тбилиси',offT:'Доставка по Тбилиси — недоступна',offR:'Регионы — недоступно',deliveryAddress:'Адрес доставки',create:'Создать заказ',created:'Заказ создан',redirect:'Переходим к оплате...',noUrl:'Keepz не вернул URL оплаты.'},
tr:{home:'Ana Sayfa',products:'Ürünler',profile:'Profil',cart:'Sepet',hero:'Teknoloji, aksesuar ve daha fazlası — hızlı ve güvenli sipariş.',view:'Ürünleri gör',categories:'Kategoriler',search:'Ad veya kod ile ara',stock:'Stok',add:'Sepete ekle',sold:'Tükendi',none:'Ürün bulunamadı.',noCats:'Henüz kategori yok.',added:'Sepete eklendi',remove:'Sil',empty:'Sepet boş',total:'Toplam',checkout:'Siparişi tamamla',auth:'Giriş',phone:'5XX XX XX XX',send:'OTP gönder',code:'6 hane',verify:'Doğrula',sent:'OTP gönderildi',loginOk:'Giriş başarılı',myProfile:'Profilim',edit:'Bilgileri düzenle',myOrders:'Siparişlerim',logout:'Çıkış',register:'Kayıt',editProfile:'Profili düzenle',first:'Ad',last:'Soyad',email:'Email',address:'Adres',save:'Kaydet',saved:'Kaydedildi',noOrders:'Sipariş yok.',pdf:'PDF fatura',payment:'Ödeme yöntemi',keepz:'Kart / taksit — Keepz',bank:'Banka havalesi',invoice:'Fatura',branch:'Şubede ödeme',delivery:'Teslimat',pickup:'Şubeden teslim — Tiflis',offT:'Tiflis teslimatı — kapalı',offR:'Bölgesel teslimat — kapalı',deliveryAddress:'Teslimat adresi',create:'Sipariş oluştur',created:'Sipariş oluşturuldu',redirect:'Ödeme sayfasına yönlendiriliyor...',noUrl:'Keepz ödeme URL’si döndürmedi.'}};
const t=k=>D[lang][k]||k,money=n=>Number(n||0).toFixed(2)+' ₾';const api=async(path,opt={})=>{const r=await fetch(cfg.apiBase+'/'+path,{...opt,headers:{'content-type':'application/json',...(opt.headers||{})}}),j=await r.json().catch(()=>({}));if(!r.ok||j.ok===false)throw new Error(j.error||'ERROR');return j};
window.toast=m=>{toast.textContent=m;toast.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>toast.style.display='none',2500)};window.setLang=v=>{lang=v;localStorage.mmLang=v;apply();renderCategories();renderProducts();syncCart()};
function apply(){document.documentElement.lang=lang;navHome.textContent=t('home');navProducts.textContent=t('products');navProfile.textContent=t('profile');navCartText.textContent=t('cart');heroText.textContent=t('hero');heroBtn.textContent=t('view');catTitle.textContent=t('categories');prodTitle.textContent=t('products');search.placeholder=t('search');cartTitle.textContent=t('cart');totalLabel.textContent=t('total');checkoutBtn.textContent=t('checkout');['ka','en','ru','tr'].forEach(x=>document.getElementById('f-'+x).classList.toggle('active',x===lang))}
function phone(v){let d=String(v||'').replace(/\D/g,'');if(/^5\d{8}$/.test(d))return'995'+d;if(/^05\d{8}$/.test(d))return'995'+d.slice(1);return d}
async function load(){try{let d=await api('catalog');S.products=d.products||[];S.categories=d.categories||[];renderCategories();renderProducts()}catch(e){toast(e.message)}}window.renderCategories=()=>categories.innerHTML=S.categories.length?S.categories.map(c=>`<div class="card" onclick="filterCat('${c.id}')" style="cursor:pointer"><div style="font-size:42px">${c.emoji||'⭐'}</div><b>${c.name||''}</b></div>`).join(''):`<div class="empty">${t('noCats')}</div>`;window.filterCat=id=>{search.value='';products.innerHTML=S.products.filter(p=>p.categoryId===id).map(productCard).join('');scrollToProducts()};
function productCard(p){return`<article class="card"><img src="${p.image||'assets/logo.jpg'}" onerror="this.src='assets/logo.jpg'"><div class="muted">${p.code||''}</div><h3>${p.name||''}</h3><div class="price">${money(p.price)}</div><div class="muted">${t('stock')}: ${p.stock??0}</div><button class="btn red" ${Number(p.stock)<=0?'disabled':''} onclick="addCart('${p.id}')">${Number(p.stock)<=0?t('sold'):t('add')}</button></article>`}window.renderProducts=()=>{let q=(search.value||'').toLowerCase(),a=S.products.filter(p=>(p.name||'').toLowerCase().includes(q)||(p.code||'').toLowerCase().includes(q));products.innerHTML=a.length?a.map(productCard).join(''):`<div class="empty">${t('none')}</div>`};
window.addCart=id=>{let p=S.products.find(x=>x.id===id),x=S.cart.find(x=>x.id===id);if(x)x.qty=Math.min(Number(p.stock),x.qty+1);else S.cart.push({id,qty:1,name:p.name,price:Number(p.price)});syncCart();toast(t('added'))};function syncCart(){cartCount.textContent=S.cart.reduce((a,x)=>a+x.qty,0);cartItems.innerHTML=S.cart.length?S.cart.map(x=>`<div class="card" style="margin:8px 0"><div class="row"><b>${x.name}</b><button class="btn" onclick="rmCart('${x.id}')">${t('remove')}</button></div><div class="row"><span>${money(x.price)}</span><span class="qty"><button class="pill" onclick="qty('${x.id}',-1)">−</button>${x.qty}<button class="pill" onclick="qty('${x.id}',1)">+</button></span></div></div>`).join(''):`<div class="empty">${t('empty')}</div>`;cartTotal.textContent=money(S.cart.reduce((a,x)=>a+x.price*x.qty,0))}window.qty=(id,n)=>{let x=S.cart.find(i=>i.id===id),p=S.products.find(i=>i.id===id);x.qty=Math.max(1,Math.min(Number(p?.stock||x.qty),x.qty+n));syncCart()};window.rmCart=id=>{S.cart=S.cart.filter(x=>x.id!==id);syncCart()};window.openCart=()=>{cart.classList.add('open');syncCart()};window.closeCart=()=>cart.classList.remove('open');window.scrollToProducts=()=>productsSection.scrollIntoView({behavior:'smooth'});window.showStore=()=>scrollTo({top:0,behavior:'smooth'});window.closeModal=()=>modal.classList.remove('open');function showModal(a,b){modalTitle.textContent=a;modalBody.innerHTML=b;modal.classList.add('open')}
function loginModal(){showModal(t('auth'),`<div class="form"><div class="row"><b>+995</b><input id="ph" inputmode="numeric" placeholder="${t('phone')}" style="flex:1"></div><button class="btn red" onclick="sendOtp()">${t('send')}</button><div id="otpArea"></div></div>`)}window.sendOtp=async()=>{try{let p=phone(ph.value);await api('otp/send',{method:'POST',body:JSON.stringify({phone:p})});otpArea.innerHTML=`<input id="oc" inputmode="numeric" maxlength="6" placeholder="${t('code')}"><button class="btn red" onclick="verifyOtp('${p}')">${t('verify')}</button>`;toast(t('sent'))}catch(e){toast(e.message)}};window.verifyOtp=async p=>{try{let d=await api('otp/verify',{method:'POST',body:JSON.stringify({phone:p,code:oc.value})});await signInWithCustomToken(auth,d.token);closeModal();d.isNew?editProfile(true):toast(t('loginOk'))}catch(e){toast(e.message)}};onAuthStateChanged(auth,()=>{});
window.openProfile=async()=>{if(!auth.currentUser)return loginModal();try{let tok=await auth.currentUser.getIdToken(),d=await api('profile',{headers:{authorization:'Bearer '+tok}});S.profile=d.profile;profileModal()}catch(e){toast(e.message)}};function profileModal(){let p=S.profile||{};showModal(t('myProfile'),`<div class="form"><b>${p.firstName||''} ${p.lastName||''}</b><div>${p.phone||auth.currentUser?.phoneNumber||''}</div><div>${p.email||''}</div><div>${p.address||''}</div><button class="btn" onclick="editProfile()">${t('edit')}</button><button class="btn" onclick="myOrders()">${t('myOrders')}</button><button class="btn red" onclick="logoutCustomer()">${t('logout')}</button></div>`)}window.editProfile=first=>{let p=S.profile||{};showModal(first?t('register'):t('editProfile'),`<div class="form"><input id="fn" placeholder="${t('first')}" value="${p.firstName||''}"><input id="ln" placeholder="${t('last')}" value="${p.lastName||''}"><input id="em" placeholder="${t('email')}" value="${p.email||''}"><input id="ad" placeholder="${t('address')}" value="${p.address||''}"><button class="btn red" onclick="saveProfile()">${t('save')}</button></div>`)};window.saveProfile=async()=>{try{let tok=await auth.currentUser.getIdToken();await api('profile',{method:'POST',headers:{authorization:'Bearer '+tok},body:JSON.stringify({firstName:fn.value,lastName:ln.value,email:em.value,address:ad.value})});closeModal();toast(t('saved'))}catch(e){toast(e.message)}};window.logoutCustomer=async()=>{await signOut(auth);closeModal()};window.myOrders=async()=>{try{let tok=await auth.currentUser.getIdToken(),d=await api('orders',{headers:{authorization:'Bearer '+tok}});showModal(t('myOrders'),d.orders.length?d.orders.map(o=>`<div class="card"><b>${o.invoice}</b><div>${o.status} · ${money(o.total)}</div><button class="btn" onclick="openInvoice('${o.invoice}')">${t('pdf')}</button></div>`).join(''):`<div class="empty">${t('noOrders')}</div>`)}catch(e){toast(e.message)}};window.openInvoice=i=>open(cfg.apiBase+'/invoice/'+encodeURIComponent(i),'_blank');
window.checkout=()=>{if(!S.cart.length)return toast(t('empty'));if(!auth.currentUser){closeCart();return loginModal()}showModal(t('checkout'),`<div class="form"><label>${t('payment')}</label><select id="pm"><option value="keepz">${t('keepz')}</option><option value="bank">${t('bank')}</option><option value="invoice">${t('invoice')}</option><option value="branch">${t('branch')}</option></select><label>${t('delivery')}</label><select id="dm"><option value="pickup">${t('pickup')}</option><option disabled>${t('offT')}</option><option disabled>${t('offR')}</option></select><input id="ca" placeholder="${t('deliveryAddress')}"><button class="btn red" onclick="placeOrder()">${t('create')}</button></div>`)};window.placeOrder=async()=>{try{let tok=await auth.currentUser.getIdToken(),d=await api('orders',{method:'POST',headers:{authorization:'Bearer '+tok},body:JSON.stringify({items:S.cart.map(x=>({id:x.id,qty:x.qty})),paymentMethod:pm.value,deliveryMethod:dm.value,address:ca.value})});let pay=d.payment;S.cart=[];syncCart();closeModal();if(pay){let url=pay.urlForQR||pay.checkoutUrl||pay.url||pay.redirectUrl;if(url){toast(t('redirect'));setTimeout(()=>location.href=url,350);return}return showModal('Keepz',`<p>${t('noUrl')}</p>`)}toast(t('created')+': '+d.invoice)}catch(e){toast(e.message)}};apply();syncCart();load();
</script></body></html>
