<!doctype html><html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MM STAR</title><link rel="icon" href="assets/logo.jpg"><style>
:root{--r:#e61928;--k:#111;--g:#f5f5f6;--b:#ddd}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#171717}button,input,select,textarea{font:inherit}.top{position:sticky;top:0;z-index:10;background:#111;color:#fff;padding:10px 4vw;display:flex;align-items:center;gap:18px;box-shadow:0 3px 12px #0003}.logo{width:120px;height:55px;object-fit:contain;background:#fff;border-radius:8px}.nav{display:flex;gap:12px;align-items:center;flex:1;flex-wrap:wrap}.nav button,.pill{border:0;border-radius:999px;padding:9px 13px;cursor:pointer}.nav button{background:#222;color:#fff}.nav button:hover,.red{background:var(--r)!important;color:#fff}.wrap{max-width:1200px;margin:auto;padding:24px 4vw}.hero{display:grid;grid-template-columns:1.3fr .7fr;gap:22px;align-items:center;background:linear-gradient(135deg,#fff,#fff1f2);border:1px solid #eee;border-radius:24px;padding:28px}.hero img{width:100%;max-height:260px;object-fit:contain}.hero h1{font-size:clamp(34px,6vw,72px);margin:0}.hero b{color:var(--r)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.card{border:1px solid #e7e7e7;border-radius:18px;padding:14px;box-shadow:0 6px 20px #0000000a;background:#fff}.card img{width:100%;height:170px;object-fit:contain;border-radius:12px;background:#fafafa}.price{font-size:21px;font-weight:800}.muted{color:#777}.btn{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;background:#111;color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.section{margin-top:28px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.toolbar input,.toolbar select,.form input,.form select,.form textarea{padding:11px;border:1px solid #ddd;border-radius:10px}.drawer{position:fixed;right:0;top:0;height:100%;width:min(440px,100%);background:#fff;z-index:20;box-shadow:-8px 0 30px #0003;padding:18px;overflow:auto;transform:translateX(100%);transition:.25s}.drawer.open{transform:none}.modal{position:fixed;inset:0;background:#0008;display:none;z-index:30;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.box{background:#fff;border-radius:18px;padding:20px;max-width:560px;width:100%;max-height:90vh;overflow:auto}.form{display:grid;gap:10px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:12px 18px;border-radius:10px;z-index:99;display:none}.admin{background:#f7f7f7;min-height:100vh}.table{width:100%;border-collapse:collapse;background:#fff}.table td,.table th{padding:10px;border-bottom:1px solid #eee;text-align:left}.badge{padding:4px 8px;border-radius:999px;background:#eee;font-size:12px}@media(max-width:760px){.hero{grid-template-columns:1fr}.nav{gap:6px}.nav .hideMob{display:none}.logo{width:88px;height:42px}.wrap{padding:16px}.table{font-size:12px}.table td,.table th{padding:7px}}
</style></head><body>
<header class="top"><img src="assets/logo.jpg" class="logo"><nav class="nav"><button onclick="showStore()">მთავარი</button><button onclick="scrollToProducts()" class="hideMob">პროდუქტები</button><button onclick="openProfile()">პროფილი</button><button onclick="openCart()">კალათა <span id="cartCount">0</span></button><div class="langFlags"><button class="pill" onclick="setLang('ka')" title="ქართული">🇬🇪</button><button class="pill" onclick="setLang('en')" title="English">🇬🇧</button><button class="pill" onclick="setLang('ru')" title="Русский">🇷🇺</button><button class="pill" onclick="setLang('tr')" title="Türkçe">🇹🇷</button></div></nav></header>
<main id="app"><div class="wrap"><section class="hero"><div><div class="muted">MM STAR ONLINE STORE</div><h1>MM <b>STAR</b></h1><p>ტექნიკა, აქსესუარები და მეტი — სწრაფი და უსაფრთხო შეკვეთით.</p><button class="btn red" onclick="scrollToProducts()">პროდუქტების ნახვა</button></div><img src="assets/logo.jpg"></section><section class="section"><h2>კატეგორიები</h2><div id="categories" class="grid"></div></section><section id="productsSection" class="section"><div class="row"><h2>პროდუქტები</h2><input id="search" placeholder="ძებნა სახელით ან კოდით" oninput="renderProducts()"></div><div id="products" class="grid"></div></section></div></main>
<div id="cart" class="drawer"><div class="row"><h2>კალათა</h2><button class="btn" onclick="closeCart()">✕</button></div><div id="cartItems"></div><hr><div class="row"><b>სულ</b><b id="cartTotal">0 ₾</b></div><button class="btn red" style="width:100%;margin-top:14px" onclick="checkout()">შეკვეთის გაფორმება</button></div>
<div id="modal" class="modal"><div class="box"><div class="row"><h2 id="modalTitle">MM STAR</h2><button class="btn" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div><div id="toast" class="toast"></div>
<script src="config.js"></script><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import {getAuth,signInWithCustomToken,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';
const cfg=window.MMSTAR_CONFIG;const fb=initializeApp(cfg.firebase);const auth=getAuth(fb);const S={products:[],categories:[],cart:[],user:null,profile:null};window.S=S;
const api=async(path,opt={})=>{const h={'content-type':'application/json',...(opt.headers||{})};const r=await fetch(cfg.apiBase+'/'+path,{...opt,headers:h});const ct=r.headers.get('content-type')||'';if(ct.includes('application/pdf'))return r;const j=await r.json().catch(()=>({}));if(!r.ok||j.ok===false)throw new Error(j.error||'ERROR');return j};
const money=n=>Number(n||0).toFixed(2)+' ₾';window.toast=m=>{const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2600)};
window.setLang=v=>{localStorage.mmLang=v;toast('Language: '+v)};
async function load(){try{const d=await api('catalog');S.products=d.products||[];S.categories=d.categories||[];renderCategories();renderProducts()}catch(e){toast('კატალოგის ჩატვირთვა ვერ მოხერხდა: '+e.message)}}load();
window.renderCategories=()=>{categories.innerHTML=S.categories.map(c=>`<div class="card" onclick="filterCat('${c.id}')" style="cursor:pointer"><div style="font-size:42px">${c.emoji||'⭐'}</div><b>${c.name}</b></div>`).join('')||'<div class="muted">კატეგორიები ჯერ არ არის დამატებული.</div>'};
window.filterCat=id=>{search.value='';products.innerHTML=S.products.filter(p=>p.categoryId===id).map(productCard).join('');scrollToProducts()};
function productCard(p){return `<article class="card"><img src="${p.image||'assets/logo.jpg'}" onerror="this.src='assets/logo.jpg'"><div class="muted">${p.code||''}</div><h3>${p.name||''}</h3><div class="price">${money(p.price)}</div><div class="muted">მარაგი: ${p.stock??0}</div><button class="btn red" ${Number(p.stock)<=0?'disabled':''} onclick="addCart('${p.id}')">${Number(p.stock)<=0?'გათავდა':'კალათაში დამატება'}</button></article>`}
window.renderProducts=()=>{const q=(search.value||'').toLowerCase();products.innerHTML=S.products.filter(p=>(p.name||'').toLowerCase().includes(q)||(p.code||'').toLowerCase().includes(q)).map(productCard).join('')||'<div class="muted">პროდუქტი ვერ მოიძებნა.</div>'};
window.addCart=id=>{const p=S.products.find(x=>x.id===id);let i=S.cart.find(x=>x.id===id);if(i)i.qty++;else S.cart.push({id,qty:1,name:p.name,price:p.price,image:p.image});syncCart();toast('პროდუქტი დაემატა კალათაში')};
function syncCart(){cartCount.textContent=S.cart.reduce((a,x)=>a+x.qty,0);cartItems.innerHTML=S.cart.map(x=>`<div class="card" style="margin:8px 0"><div class="row"><b>${x.name}</b><button class="btn" onclick="rmCart('${x.id}')">წაშლა</button></div><div class="row"><span>${money(x.price)}</span><span><button class="pill" onclick="qty('${x.id}',-1)">−</button> ${x.qty} <button class="pill" onclick="qty('${x.id}',1)">+</button></span></div></div>`).join('')||'<p class="muted">კალათა ცარიელია</p>';cartTotal.textContent=money(S.cart.reduce((a,x)=>a+x.price*x.qty,0))}window.qty=(id,n)=>{const x=S.cart.find(i=>i.id===id);x.qty=Math.max(1,x.qty+n);syncCart()};window.rmCart=id=>{S.cart=S.cart.filter(x=>x.id!==id);syncCart()};window.openCart=()=>{cart.classList.add('open');syncCart()};window.closeCart=()=>cart.classList.remove('open');window.scrollToProducts=()=>document.getElementById('productsSection')?.scrollIntoView({behavior:'smooth'});window.showStore=()=>location.reload();
window.closeModal=()=>modal.classList.remove('open');function showModal(title,html){modalTitle.textContent=title;modalBody.innerHTML=html;modal.classList.add('open')}
window.openProfile=async()=>{if(!auth.currentUser)return loginModal();try{const t=await auth.currentUser.getIdToken();const d=await api('profile',{headers:{authorization:'Bearer '+t}});S.profile=d.profile;profileModal()}catch(e){toast(e.message)}};
function loginModal(){showModal('ავტორიზაცია',`<div class="form"><input id="ph" placeholder="+995 5XX XX XX XX"><button class="btn red" onclick="sendOtp()">OTP კოდის გაგზავნა</button><div id="otpArea"></div></div>`)}
window.sendOtp=async()=>{try{const phone=ph.value;await api('otp/send',{method:'POST',body:JSON.stringify({phone})});otpArea.innerHTML=`<input id="oc" placeholder="6 ციფრი"><button class="btn red" onclick="verifyOtp('${phone}')">დადასტურება</button>`;toast('OTP გაიგზავნა')}catch(e){toast(e.message)}};
window.verifyOtp=async phone=>{try{const d=await api('otp/verify',{method:'POST',body:JSON.stringify({phone,code:oc.value})});await signInWithCustomToken(auth,d.token);closeModal();if(d.isNew)editProfile(true);else toast('ავტორიზაცია წარმატებულია')}catch(e){toast(e.message)}};
onAuthStateChanged(auth,u=>{S.user=u});
async function profileModal(){const p=S.profile||{};showModal('ჩემი პროფილი',`<div class="form"><div><b>${p.firstName||''} ${p.lastName||''}</b></div><div>${p.phone||auth.currentUser?.phoneNumber||''}</div><div>${p.email||''}</div><div>${p.address||''}</div><button class="btn" onclick="editProfile()">ინფორმაციის შეცვლა</button><button class="btn" onclick="myOrders()">ჩემი შეკვეთები</button><button class="btn red" onclick="logoutCustomer()">გასვლა</button></div>`)}
window.editProfile=first=>{const p=S.profile||{};showModal(first?'რეგისტრაცია':'პროფილის რედაქტირება',`<div class="form"><input id="fn" placeholder="სახელი" value="${p.firstName||''}"><input id="ln" placeholder="გვარი" value="${p.lastName||''}"><input id="em" placeholder="Email" value="${p.email||''}"><input id="ad" placeholder="მისამართი" value="${p.address||''}"><button class="btn red" onclick="saveProfile()">შენახვა</button></div>`)};
window.saveProfile=async()=>{try{const t=await auth.currentUser.getIdToken();await api('profile',{method:'POST',headers:{authorization:'Bearer '+t},body:JSON.stringify({firstName:fn.value,lastName:ln.value,email:em.value,address:ad.value})});closeModal();toast('რეგისტრაცია წარმატებით დასრულდა')}catch(e){toast(e.message)}};window.logoutCustomer=async()=>{await signOut(auth);closeModal();toast('გასვლა შესრულდა')};
window.myOrders=async()=>{try{const t=await auth.currentUser.getIdToken();const d=await api('orders',{headers:{authorization:'Bearer '+t}});showModal('ჩემი შეკვეთები',d.orders.map(o=>`<div class="card"><b>${o.invoice}</b><div>${o.status} · ${money(o.total)}</div><button class="btn" onclick="openInvoice('${o.invoice}')">PDF ინვოისი</button></div>`).join('')||'<p>შეკვეთები არ არის.</p>')}catch(e){toast(e.message)}};window.openInvoice=i=>window.open(cfg.apiBase+'/invoice/'+encodeURIComponent(i),'_blank');
window.checkout=async()=>{if(!S.cart.length)return toast('კალათა ცარიელია');if(!auth.currentUser){closeCart();return loginModal()}showModal('Checkout',`<div class="form"><select id="pm"><option value="keepz">ბარათით გადახდა / განვადება — Keepz</option><option value="bank">საბანკო გადარიცხვა</option><option value="invoice">ინვოისი</option><option value="branch">ფილიალში გადახდა</option></select><select id="dm"><option value="pickup">ფილიალიდან გატანა — თბილისი</option><option disabled>თბილისში მიწოდება — დროებით მიუწვდომელი</option><option disabled>რეგიონში მიწოდება — დროებით მიუწვდომელი</option></select><input id="ca" placeholder="მიწოდების მისამართი (საჭიროებისას)"><button class="btn red" onclick="placeOrder()">შეკვეთის შექმნა</button></div>`)};
window.placeOrder=async()=>{try{const t=await auth.currentUser.getIdToken();const d=await api('orders',{method:'POST',headers:{authorization:'Bearer '+t},body:JSON.stringify({items:S.cart.map(x=>({id:x.id,qty:x.qty})),paymentMethod:pm.value,deliveryMethod:dm.value,address:ca.value})});S.cart=[];syncCart();closeModal();toast('შეკვეთა წარმატებით შეიქმნა: '+d.invoice);if(d.payment){const url=d.payment.checkoutUrl||d.payment.url||d.payment.redirectUrl;if(url)location.href=url;else showModal('Keepz',`<p>გადახდის შეკვეთა შეიქმნა, მაგრამ პასუხში redirect URL ვერ მოიძებნა.</p><pre>${JSON.stringify(d.payment,null,2)}</pre>`)} }catch(e){toast(e.message)}};
</script></body></html>
