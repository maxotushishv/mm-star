async function api(path,opt={}){const r=await fetch(cfg.apiBase+'/'+path,{...opt,headers:{'content-type':'application/json',...(opt.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw new Error(d.error||`HTTP_${r.status}`);return d}function toast(m){$('toast').textContent=m;$('toast').style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').style.display='none',2600)}

function totalWeight(){return state.cart.reduce((a,x)=>a+Number(x.weightKg||1)*Number(x.qty||1),0)}function fee(){if(state.delivery==='pickup')return 0;const row=state.tariffs.find(r=>totalWeight()<=r.maxKg)||state.tariffs.at(-1);if(!row)return 0;if(state.delivery==='tbilisi')return row.city;if(state.delivery==='region'){const key=state.courierType==='city'?'centralCity':(state.courierLocation.startsWith('თბილისი >')?'outskirts':'region');state.zone=key;return Number(row[key]??row.region??0)}return 0}function subtotal(){return state.cart.reduce((a,x)=>a+Number(x.price)*Number(x.qty),0)}

function renderPayment(){$('paymentChoices').innerHTML=[['keepz','card',t('card'),t('cardSub')],['invoice','invoice',t('invoice'),t('invoiceSub')],['branch','store',t('branchPay'),t('branchPaySub')]].map(([id,ic,a,b])=>`<button class="choice ${state.payment===id?'selected':''}" data-pay="${id}"><div class="choice-icon">${icon(ic)}</div><strong>${a}</strong><small>${b}</small></button>`).join('');$('paymentChoices').querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{state.payment=b.dataset.pay;renderPayment()});const old=$('bankTransferInfo');if(old)old.remove();if(state.payment==='invoice'){const s=state.settings||{};$('paymentChoices').insertAdjacentHTML('afterend',`<div class="invoice-bank-card" id="bankTransferInfo">

function nextCourierDate(days){const allowed=String(days||'').split(',').map(x=>DAY_INDEX[x.trim()]).filter(x=>Number.isInteger(x));if(!allowed.length)return'';const d=new Date();d.setHours(12,0,0,0);for(let i=1;i<=14;i++){const n=new Date(d);n.setDate(d.getDate()+i);if(allowed.includes(n.getDay()))return n.toISOString().slice(0,10)}return''}

 $('deliveryChoices').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{state.delivery=b.dataset.del;if(state.delivery==='tbilisi'){const z=courierZones.find(x=>x.name==='თბილისი');state.courierLocation='თბილისი';state.courierDays=z?.days||'';state.estimatedDeliveryDate=nextCourierDate(state.courierDays);state.zone='city'}if(state.delivery==='pickup'){state.courierLocation='';state.courierDays='';state.estimatedDeliveryDate=''}renderDelivery();renderSummary()});
 let h='';
 if(state.delivery==='pickup')h=`<div class="notice">📍 Lilo Mall — სექტორი C, რიგი CC9, მაღაზია №1</div>`;

 if(state.delivery==='region'){
   const list=courierZones.filter(x=>x.kind===state.courierType);
   h=`<div class="courier-type-switch"><button class="${state.courierType==='city'?'active':''}" data-ctype="city">🏙️ ${t('cityType')}</button><button class="${state.courierType==='region'?'active':''}" data-ctype="region">📍 ${t('regionType')}</button></div><div class="form-grid"><div class="field"><label>${t('courierPlace')}</label><input id="courierPlace" list="courierPlaces" value="${esc(state.courierLocation)}" placeholder="${t('courierPlace')}"><datalist id="courierPlaces">${list.map(x=>`<option value="${esc(x.name)}"></option>`).join('')}</datalist></div><div class="field"><label>${t('street')}</label><input id="addressInput" value="${esc(state.address||state.profile?.address||'')}"></div></div>${courierInfoHtml()}<p class="muted">${t('feeFrom')}: ${money(fee())} • ${t('weight')}: ${totalWeight().toFixed(2)} kg</p>`;
 }
 $('deliveryDetails').innerHTML=h;
 $('deliveryDetails').querySelectorAll('[data-ctype]').forEach(b=>b.onclick=()=>{state.courierType=b.dataset.ctype;state.courierLocation='';state.courierDays='';state.estimatedDeliveryDate='';renderDelivery();renderSummary()});
 if($('districtSelect'))$('districtSelect').onchange=e=>state.district=e.target.value;

 if($('addressInput'))$('addressInput').oninput=e=>state.address=e.target.value;
}
function renderSummary(){if(!state.cart.length){$('summaryItems').innerHTML=`<div class="empty">${t('empty')}<br><br><a class="btn btn-light" href="index.html">${t('back')}</a></div>`;$('placeOrder').disabled=true}else{$('summaryItems').innerHTML=state.cart.map(x=>`<div class="order-product" style="margin:8px 0"><img src="${esc(x.image||'assets/logo.jpg')}" onerror="this.src='assets/logo.jpg'"><div><b>${esc(x.name)}</b><div class="muted">${x.qty} × ${money(x.price)}</div></div><b>${money(x.price*x.qty)}</b></div>`).join('');$('placeOrder').disabled=!state.user}const s=subtotal(),f=fee();$('sumProducts').textContent=money(s);$('sumDelivery').textContent=money(f);$('sumTotal').textContent=money(s+f)}
function renderCustomer(){if(!state.user){$('customerBox').innerHTML=`<div class="notice">${t('loginNeeded')}</div><div class="form" style="margin-top:12px"><div class="otp-phone"><div class="phone-prefix">+995</div><input id="phone" inputmode="numeric" placeholder="${t('phone')}"></div><button class="btn btn-primary" id="sendOtp">${t('send')}</button><div id="otpZone"></div></div>`;$('sendOtp').onclick=sendOtp;return}const p=state.profile||{};$('customerBox').innerHTML=`<div class="card-row"><div><b>${esc((p.firstName||'')+' '+(p.lastName||''))}</b><div class="muted">${esc(p.phone||state.user.phoneNumber||'')}</div><div class="muted">${esc(p.address||'')}</div></div><span class="status-pill">✓</span></div>`}
async function sendOtp(){try{const p=normalizePhone($('phone').value);await api('otp/send',{method:'POST',body:JSON.stringify({phone:p})});$('otpZone').innerHTML=`<div class="form"><input id="otp" inputmode="numeric" maxlength="6" placeholder="${t('otp')}"><button class="btn btn-dark" id="verifyOtp">${t('verify')}</button></div>`;$('verifyOtp').onclick=()=>verify(p);toast(t('sent'))}catch(e){toast(e.message)}}async function verify(phone){try{const d=await api('otp/verify',{method:'POST',body:JSON.stringify({phone,code:$('otp').value})});await signInWithCustomToken(auth,d.token)}catch(e){toast(e.message)}}
async function loadProfile(){if(!auth.currentUser)return;const tok=await auth.currentUser.getIdToken(),d=await api('profile',{headers:{authorization:'Bearer '+tok}});state.profile=d.profile}
async function place(){if(!state.user||!state.cart.length)return;if(state.delivery!=='pickup'&&!state.address&&!state.profile?.address)return toast(t('profileMissing'));if(state.delivery==='region'&&!state.courierLocation)return toast(t('courierPlace'));try{$('placeOrder').disabled=true;const tok=await auth.currentUser.getIdToken(),d=await api('orders',{method:'POST',headers:{authorization:'Bearer '+tok},body:JSON.stringify({items:state.cart.map(x=>({id:x.id,qty:x.qty})),paymentMethod:state.payment,deliveryMethod:state.delivery,deliveryZone:state.zone,district:state.district,address:state.address||state.profile?.address||'',courierType:state.courierType,courierLocation:state.courierLocation,courierDays:state.courierDays,estimatedDeliveryDate:state.estimatedDeliveryDate,language:lang})});if(d.payment){const url=d.payment.urlForQR||d.payment.checkoutUrl||d.payment.url||d.payment.redirectUrl;if(url){sessionStorage.setItem('mmKeepzIntent',d.paymentIntentId||'');toast(t('redirect'));setTimeout(()=>location.assign(url),450);return}}
if(state.payment==='invoice'){
  const phone=state.profile?.phone||state.user?.phoneNumber||'',s=d.bank||state.settings||{};
  localStorage.removeItem('mmCart');state.cart=[];
  $('paymentBanner').innerHTML=`<div class="success-box invoice-success">
    <h3>✅ შეკვეთა წარმატებით შეიქმნა</h3>
    <div class="success-invoice">${esc(d.invoice)}</div>
    <div class="invoice-bank-row"><span>ბანკი</span><b>${esc(s.bank||'საქართველოს ბანკი')}</b></div>
    <div class="invoice-bank-row"><span>IBAN</span><strong class="invoice-iban">${esc(s.iban||'GE78BG0000000954382600')}</strong></div>
    <div class="invoice-purpose-final"><span>დანიშნულებაში აუცილებლად მიუთითეთ</span><strong>${esc(d.invoice)} • ${esc(phone)}</strong></div>
    <p class="muted">გადარიცხვის შემდეგ შეკვეთა გამოჩნდება ადმინისტრატორისა და გაყიდვების პერსონალის „დასადასტურებელ შეკვეთებში“.</p>
    <p class="redirect-note">მთავარ გვერდზე ავტომატურად გადახვალთ <b id="homeCountdown">10</b> წამში.</p>
    <a class="btn btn-dark" href="index.html">მთავარ გვერდზე გადასვლა</a>
  </div>`;
  renderSummary();scrollTo({top:0,behavior:'smooth'});startHomeRedirect(10);return
}
localStorage.removeItem('mmCart');state.cart=[];
$('paymentBanner').innerHTML=`<div class="success-box"><h3>✅ ${t('created')}</h3><div class="success-invoice">${esc(d.invoice)}</div><p class="redirect-note">მთავარ გვერდზე ავტომატურად გადახვალთ <b id="homeCountdown">5</b> წამში.</p></div>`;
renderSummary();scrollTo({top:0,behavior:'smooth'});startHomeRedirect(5)}catch(e){console.error(e);toast(e.message)}finally{$('placeOrder').disabled=!state.user||!state.cart.length}}
function startHomeRedirect(seconds){
  let n=seconds;
  const el=()=>document.getElementById('homeCountdown');
  const timer=setInterval(()=>{n--;if(el())el().textContent=n;if(n<=0){clearInterval(timer);location.assign('index.html')}},1000);
}
async function pollPayment(intent){if(!intent)return;for(let n=0;n<18;n++){try{const d=await api('payment/status/'+encodeURIComponent(intent));if(d.state==='completed'){localStorage.removeItem('mmCart');state.cart=[];sessionStorage.removeItem('mmKeepzIntent');$('paymentBanner').innerHTML=`<div class="success-box"><h3>✅ ${t('paid')}</h3><div class="success-invoice">${esc(d.invoice||'')}</div><p class="redirect-note">მთავარ გვერდზე ავტომატურად გადახვალთ <b id="homeCountdown">5</b> წამში.</p></div>`;renderSummary();startHomeRedirect(5);return}if(d.state==='failed'){$('paymentBanner').innerHTML=`<div class="notice">${t('failed')}</div>`;return}}catch{}await new Promise(r=>setTimeout(r,1400))}$('paymentBanner').innerHTML=`<div class="notice">გადახდა მიღებულია, ველოდებით ბანკის საბოლოო დადასტურებას. გვერდი შეგიძლიათ რამდენიმე წამში განაახლოთ.</div>`}
function renderBanner(){const q=new URLSearchParams(location.search),p=q.get('payment'),intent=q.get('intent')||sessionStorage.getItem('mmKeepzIntent');if(p==='success'){$('paymentBanner').innerHTML=`<div class="notice">გადახდა მუშავდება — ველოდებით Keepz-ის სერვერულ დადასტურებას…</div>`;pollPayment(intent)}else if(p==='failed')$('paymentBanner').innerHTML=`<div class="notice">${t('failed')}</div>`;else $('paymentBanner').innerHTML=''}
async function init(){try{const d=await api('catalog');state.products=d.products||[];state.tariffs=d.deliveryTariffs||[];state.settings=d.settings||{};state.cart=state.cart.map(x=>{const p=state.products.find(y=>y.id===x.id);return p?{...x,price:Number((p.effectivePrice??p.price)||0),weightKg:Number(p.weightKg||1),stock:Number(p.stock||0),image:p.image||x.image}:{...x}});apply()}catch(e){toast(e.message)}}
document.querySelectorAll('.flag-btn').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem('mmLang',lang);apply()});$('placeOrder').onclick=place;onAuthStateChanged(auth,async u=>{state.user=u;if(u)await loadProfile().catch(()=>{});apply()});init();
</script></body></html>
