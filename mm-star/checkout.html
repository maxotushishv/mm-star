ru:{title:'Оформление заказа',sub:'Проверьте товары, выберите оплату и доставку',customer:'Покупатель',loginNeeded:'Войдите, чтобы оформить заказ',phone:'5XX XX XX XX',send:'Отправить OTP',otp:'6 цифр',verify:'Подтвердить',sent:'OTP отправлен',payment:'Способ оплаты',card:'Карта / Рассрочка',cardSub:'Безопасная оплата через Keepz',invoice:'Инвойс',invoiceSub:'Заказ по инвойсу',branchPay:'Оплата в филиале',branchPaySub:'Оплата на месте',delivery:'Способ доставки',pickup:'Самовывоз',pickupSub:'Lilo Mall — магазин №1',tbilisi:'Доставка по Тбилиси',tbilisiSub:'Тариф по весу',region:'Доставка в регион',regionSub:'Выберите тип населенного пункта',district:'Район Тбилиси',street:'Адрес / улица / дом',zone:'Тип населенного пункта',zRegion:'Регион',zCentral:'Центральный город',zVillage:'Село',zMountain:'Высокогорье',zOutskirts:'Пригород Тбилиси',summary:'Итоги заказа',products:'Товары',deliveryFee:'Доставка',total:'Итого',place:'Создать заказ',note:'Цена и склад повторно проверяются сервером.',empty:'Корзина пуста',back:'Вернуться к товарам',created:'Заказ создан',redirect:'Переходим на Keepz…',paid:'Оплата завершена. Статус скоро обновится.',failed:'Оплата не завершена.',profileMissing:'Заполните имя и адрес в профиле',feeFrom:'Тариф по весу',weight:'Общий вес'},

const t=k=>T[lang][k]||k,money=n=>`${Number(n||0).toFixed(2)} ₾`,esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(path,opt={}){const r=await fetch(cfg.apiBase+'/'+path,{...opt,headers:{'content-type':'application/json',...(opt.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw new Error(d.error||`HTTP_${r.status}`);return d}function toast(m){$('toast').textContent=m;$('toast').style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').style.display='none',2600)}
function normalizePhone(v){let d=String(v||'').replace(/\D/g,'');if(/^5\d{8}$/.test(d))return'995'+d;if(/^05\d{8}$/.test(d))return'995'+d.slice(1);return d}
function totalWeight(){return state.cart.reduce((a,x)=>a+Number(x.weightKg||1)*Number(x.qty||1),0)}function fee(){if(state.delivery==='pickup')return 0;const row=state.tariffs.find(r=>totalWeight()<=r.maxKg)||state.tariffs.at(-1);if(!row)return 0;if(state.delivery==='tbilisi')return row.city;return Number(row[state.zone]??row.region??0)}function subtotal(){return state.cart.reduce((a,x)=>a+Number(x.price)*Number(x.qty),0)}
function icon(type){const x={card:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>',invoice:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2h9l3 3v17l-3-2-3 2-3-2-3 2z"/><path d="M9 9h6M9 13h6"/></svg>',store:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l2-6h14l2 6"/><path d="M5 13v8h14v-8M9 21v-6h6v6"/><path d="M3 9c0 2 3 3 4.5 1C9 12 12 12 13.5 10 15 12 18 12 21 9"/></svg>',truck:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5h11v12H3zM14 9h4l3 4v4h-7z"/><circle cx="7" cy="19" r="2"/><circle cx="18" cy="19" r="2"/></svg>',pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s7-6 7-12a7 7 0 10-14 0c0 6 7 12 7 12z"/><circle cx="12" cy="9" r="2"/></svg>'};return x[type]||x.card}
function apply(){document.documentElement.lang=lang;document.querySelectorAll('.flag-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));$('pageTitle').textContent=t('title');$('pageSub').textContent=t('sub');$('customerTitle').textContent=t('customer');$('paymentTitle').textContent=t('payment');$('deliveryTitle').textContent=t('delivery');$('summaryTitle').textContent=t('summary');$('sumProductsLabel').textContent=t('products');$('sumDeliveryLabel').textContent=t('deliveryFee');$('sumTotalLabel').textContent=t('total');$('placeOrder').textContent=t('place');$('summaryNote').textContent=t('note');renderPayment();renderDelivery();renderSummary();renderCustomer();renderBanner()}
function renderPayment(){$('paymentChoices').innerHTML=[['keepz','card',t('card'),t('cardSub')],['invoice','invoice',t('invoice'),t('invoiceSub')],['branch','store',t('branchPay'),t('branchPaySub')]].map(([id,ic,a,b])=>`<button class="choice ${state.payment===id?'selected':''}" data-pay="${id}"><div class="choice-icon">${icon(ic)}</div><strong>${a}</strong><small>${b}</small></button>`).join('');$('paymentChoices').querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{state.payment=b.dataset.pay;renderPayment()});const old=$('bankTransferInfo');if(old)old.remove();if(state.payment==='invoice'){const s=state.settings||{};$('paymentChoices').insertAdjacentHTML('afterend',`<div class="notice" id="bankTransferInfo" style="margin-top:12px"><b>🏦 ${esc(s.bank||'საქართველოს ბანკი')}</b><br><span style="font-family:monospace;font-size:15px">${esc(s.iban||'GE78BG0000000954382600')}</span><br><small>მიმღები: შპს „მ.მ.M.M“ • ს/კ ${esc(s.companyId||'434157066')}</small><br><small>შეკვეთის შექმნის შემდეგ დანიშნულება ავტომატურად გამოჩნდება: შეკვეთის ნომერი + თქვენი მობილურის ნომერი.</small></div>`)}}
const districts=['ისანი','სამგორი','ვაკე','საბურთალო','გლდანი','ნაძალადევი','დიდუბე','ჩუღურეთი','კრწანისი','მთაწმინდა'];
function renderDelivery(){$('deliveryChoices').innerHTML=[['pickup','store',t('pickup'),t('pickupSub')],['tbilisi','pin',t('tbilisi'),t('tbilisiSub')],['region','truck',t('region'),t('regionSub')]].map(([id,ic,a,b])=>`<button class="choice ${state.delivery===id?'selected':''}" data-del="${id}"><div class="choice-icon">${icon(ic)}</div><strong>${a}</strong><small>${b}</small></button>`).join('');$('deliveryChoices').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{state.delivery=b.dataset.del;renderDelivery();renderSummary()});let h='';if(state.delivery==='pickup')h=`<div class="notice">📍 Lilo Mall — სექტორი C, რიგი CC9, მაღაზია №1</div>`;if(state.delivery==='tbilisi')h=`<div class="form-grid"><div class="field"><label>${t('district')}</label><select id="districtSelect"><option value="">—</option>${districts.map(x=>`<option ${state.district===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>${t('street')}</label><input id="addressInput" value="${esc(state.address||state.profile?.address||'')}"></div></div><p class="muted">${t('feeFrom')}: ${money(fee())} • ${t('weight')}: ${totalWeight().toFixed(2)} kg</p>`;if(state.delivery==='region')h=`<div class="form-grid"><div class="field"><label>${t('zone')}</label><select id="zoneSelect"><option value="region">${t('zRegion')}</option><option value="centralCity">${t('zCentral')}</option><option value="village">${t('zVillage')}</option><option value="mountain">${t('zMountain')}</option><option value="outskirts">${t('zOutskirts')}</option></select></div><div class="field"><label>${t('street')}</label><input id="addressInput" value="${esc(state.address||state.profile?.address||'')}"></div></div><p class="muted">${t('feeFrom')}: ${money(fee())} • ${t('weight')}: ${totalWeight().toFixed(2)} kg</p>`;$('deliveryDetails').innerHTML=h;if($('districtSelect'))$('districtSelect').onchange=e=>state.district=e.target.value;if($('zoneSelect')){$('zoneSelect').value=state.zone;$('zoneSelect').onchange=e=>{state.zone=e.target.value;renderDelivery();renderSummary()}}if($('addressInput'))$('addressInput').oninput=e=>state.address=e.target.value}
function renderSummary(){if(!state.cart.length){$('summaryItems').innerHTML=`<div class="empty">${t('empty')}<br><br><a class="btn btn-light" href="index.html">${t('back')}</a></div>`;$('placeOrder').disabled=true}else{$('summaryItems').innerHTML=state.cart.map(x=>`<div class="order-product" style="margin:8px 0"><img src="${esc(x.image||'assets/logo.jpg')}" onerror="this.src='assets/logo.jpg'"><div><b>${esc(x.name)}</b><div class="muted">${x.qty} × ${money(x.price)}</div></div><b>${money(x.price*x.qty)}</b></div>`).join('');$('placeOrder').disabled=!state.user}const s=subtotal(),f=fee();$('sumProducts').textContent=money(s);$('sumDelivery').textContent=money(f);$('sumTotal').textContent=money(s+f)}
function renderCustomer(){if(!state.user){$('customerBox').innerHTML=`<div class="notice">${t('loginNeeded')}</div><div class="form" style="margin-top:12px"><div class="otp-phone"><div class="phone-prefix">+995</div><input id="phone" inputmode="numeric" placeholder="${t('phone')}"></div><button class="btn btn-primary" id="sendOtp">${t('send')}</button><div id="otpZone"></div></div>`;$('sendOtp').onclick=sendOtp;return}const p=state.profile||{};$('customerBox').innerHTML=`<div class="card-row"><div><b>${esc((p.firstName||'')+' '+(p.lastName||''))}</b><div class="muted">${esc(p.phone||state.user.phoneNumber||'')}</div><div class="muted">${esc(p.address||'')}</div></div><span class="status-pill">✓</span></div>`}
async function sendOtp(){try{const p=normalizePhone($('phone').value);await api('otp/send',{method:'POST',body:JSON.stringify({phone:p})});$('otpZone').innerHTML=`<div class="form"><input id="otp" inputmode="numeric" maxlength="6" placeholder="${t('otp')}"><button class="btn btn-dark" id="verifyOtp">${t('verify')}</button></div>`;$('verifyOtp').onclick=()=>verify(p);toast(t('sent'))}catch(e){toast(e.message)}}async function verify(phone){try{const d=await api('otp/verify',{method:'POST',body:JSON.stringify({phone,code:$('otp').value})});await signInWithCustomToken(auth,d.token)}catch(e){toast(e.message)}}
async function loadProfile(){if(!auth.currentUser)return;const tok=await auth.currentUser.getIdToken(),d=await api('profile',{headers:{authorization:'Bearer '+tok}});state.profile=d.profile}
async function place(){if(!state.user||!state.cart.length)return;if(state.delivery!=='pickup'&&!state.address&&!state.profile?.address)return toast(t('profileMissing'));try{$('placeOrder').disabled=true;const tok=await auth.currentUser.getIdToken(),d=await api('orders',{method:'POST',headers:{authorization:'Bearer '+tok},body:JSON.stringify({items:state.cart.map(x=>({id:x.id,qty:x.qty})),paymentMethod:state.payment,deliveryMethod:state.delivery,deliveryZone:state.zone,district:state.district,address:state.address||state.profile?.address||'',language:lang})});if(d.payment){const url=d.payment.urlForQR||d.payment.checkoutUrl||d.payment.url||d.payment.redirectUrl;if(url){sessionStorage.setItem('mmKeepzIntent',d.paymentIntentId||'');toast(t('redirect'));setTimeout(()=>location.assign(url),450);return}}
if(state.payment==='invoice'){const phone=state.profile?.phone||state.user?.phoneNumber||'',s=d.bank||state.settings||{};localStorage.removeItem('mmCart');state.cart=[];$('paymentBanner').innerHTML=`<div class="success-box"><h3>შეკვეთა შეიქმნა — გადახდის დადასტურების მოლოდინში</h3><p><b>${d.invoice}</b></p><p>🏦 <b>${esc(s.bank||'საქართველოს ბანკი')}</b><br><span style="font-family:monospace;font-size:16px">${esc(s.iban||'GE78BG0000000954382600')}</span></p><p>მიმღები: შპს „მ.მ.M.M“ • ს/კ ${esc(s.companyId||'434157066')}</p><div class="notice"><b>დანიშნულებაში მიუთითეთ:</b><br>${esc(d.invoice)} • ${esc(phone)}</div><p class="muted">გადარიცხვის შემდეგ შეკვეთა გამოჩნდება ადმინისტრატორისა და გაყიდვების პერსონალის „დასადასტურებელ შეკვეთებში“.</p></div>`;renderSummary();scrollTo({top:0,behavior:'smooth'});return}
localStorage.removeItem('mmCart');state.cart=[];$('paymentBanner').innerHTML=`<div class="success-box"><h3>${t('created')}</h3><b>${d.invoice}</b></div>`;renderSummary();scrollTo({top:0,behavior:'smooth'})}catch(e){console.error(e);toast(e.message)}finally{$('placeOrder').disabled=!state.user||!state.cart.length}}
async function pollPayment(intent){if(!intent)return;for(let n=0;n<18;n++){try{const d=await api('payment/status/'+encodeURIComponent(intent));if(d.state==='completed'){localStorage.removeItem('mmCart');state.cart=[];sessionStorage.removeItem('mmKeepzIntent');$('paymentBanner').innerHTML=`<div class="success-box"><h3>${t('paid')}</h3><b>${esc(d.invoice||'')}</b></div>`;renderSummary();return}if(d.state==='failed'){$('paymentBanner').innerHTML=`<div class="notice">${t('failed')}</div>`;return}}catch{}await new Promise(r=>setTimeout(r,1400))}$('paymentBanner').innerHTML=`<div class="notice">გადახდა მიღებულია, ველოდებით ბანკის საბოლოო დადასტურებას. გვერდი შეგიძლიათ რამდენიმე წამში განაახლოთ.</div>`}
function renderBanner(){const q=new URLSearchParams(location.search),p=q.get('payment'),intent=q.get('intent')||sessionStorage.getItem('mmKeepzIntent');if(p==='success'){$('paymentBanner').innerHTML=`<div class="notice">გადახდა მუშავდება — ველოდებით Keepz-ის სერვერულ დადასტურებას…</div>`;pollPayment(intent)}else if(p==='failed')$('paymentBanner').innerHTML=`<div class="notice">${t('failed')}</div>`;else $('paymentBanner').innerHTML=''}
async function init(){try{const d=await api('catalog');state.products=d.products||[];state.tariffs=d.deliveryTariffs||[];state.settings=d.settings||{};state.cart=state.cart.map(x=>{const p=state.products.find(y=>y.id===x.id);return p?{...x,price:Number((p.effectivePrice??p.price)||0),weightKg:Number(p.weightKg||1),stock:Number(p.stock||0),image:p.image||x.image}:{...x}});apply()}catch(e){toast(e.message)}}
document.querySelectorAll('.flag-btn').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem('mmLang',lang);apply()});$('placeOrder').onclick=place;onAuthStateChanged(auth,async u=>{state.user=u;if(u)await loadProfile().catch(()=>{});apply()});init();
</script></body></html>
